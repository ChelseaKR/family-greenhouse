# FUNDING configuration: family-greenhouse advertises no donation rail.
#
# This project already has a checkout. Subscription plans and a licensing
# contact are described in the README, and a donation prompt alongside them
# competes with both while muddling what the project is asking for.
#
# Money questions here route through the paths already documented.
#
# Every platform key below is present and explicitly empty. With no active
# entries GitHub renders no Sponsor button, and this file overrides the
# organisation-wide default in ChelseaKR/.github rather than merging with it.

github: # no GitHub Sponsors
patreon: # not used
open_collective: # not used
ko_fi: # not used
tidelift: # not used
community_bridge: # not used
liberapay: # not used
issuehunt: # not used
lfx_crowdfunding: # not used
polar: # not used
buy_me_a_coffee: # not used
thanks_dev: # not used
custom: # no external donation links
