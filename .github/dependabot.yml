version: 2
updates:
  # --- npm workspaces ---
  # Root holds shared tooling (eslint, prettier, commitlint); the two workspaces
  # carry their own runtime deps. Dependabot needs one entry per manifest.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Supply-chain cooldown (zizmor `dependabot-cooldown`): let a freshly
    # published version sit for a few days before Dependabot proposes it, so a
    # compromised or hijacked release has time to be yanked upstream before it
    # ever reaches a PR here. Cooldown applies to VERSION updates only —
    # Dependabot *security* updates ignore it, so a real advisory is still
    # raised immediately.
    #
    # Nothing is below 7 days on purpose. zizmor only enforces the
    # `default-days` floor, but a hijacked release is typically published as
    # a PATCH — the channel that attracts least scrutiny and the most
    # traffic — so holding patches to a shorter window than the default
    # would leave the likeliest attack path the least protected.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk dev tooling so we get one PR, not a dozen.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    # Supply-chain cooldown — see the first entry above.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    open-pull-requests-limit: 5
    groups:
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - backend

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    # Supply-chain cooldown — see the first entry above.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - frontend

  # --- GitHub Actions ---
  # The Node 24-compatible action majors have landed (checkout 7, setup-node 6,
  # codecov 7, artifact actions 7/8), so normal weekly cadence is sufficient.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Supply-chain cooldown — see the first entry above. `default-days` only:
    # Dependabot rejects the `semver-*-days` keys for non-semver ecosystems
    # (github-actions, terraform), and an invalid dependabot.yml stops
    # Dependabot running for the whole repository, not just this entry.
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - ci
    # One PR for the whole CodeQL action set: init, analyze, autobuild and
    # upload-sarif must always run the same version. Since CodeQL Action
    # 3.30.4 the non-init steps hard-error when they load a configuration
    # file written by a different version, so a half-applied bump breaks the
    # scan rather than merely warning.
    groups:
      codeql-action:
        patterns:
          - github/codeql-action*

  # --- Terraform providers/modules ---
  - package-ecosystem: terraform
    directory: /infrastructure
    schedule:
      interval: weekly
      day: monday
    # Supply-chain cooldown — see the first entry above. `default-days` only,
    # for the same reason as the github-actions entry.
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - infra
