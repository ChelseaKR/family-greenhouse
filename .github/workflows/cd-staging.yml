name: Deploy to Staging

# State is now ISOLATED: the Terraform Apply step below inits with
# `-backend-config="key=staging/terraform.tfstate"`, so staging has its own
# state file and a staging apply can no longer touch the production stack
# (which lives under the default `terraform.tfstate` key). The prod-destruction
# landmine is closed.
#
# Still kept MANUAL (workflow_dispatch only), deliberately: a staging apply now
# stands up a full *separate* staging stack (Cognito/DDB/API/CloudFront...),
# which costs money — that should be an intentional choice, not something every
# push to main provisions. Re-enable `push: main` only when a standing staging
# environment is actually wanted.
on:
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  AWS_REGION: us-east-1
  ENVIRONMENT: staging

# Least-privilege default: read-only token. Jobs that assume an AWS role via
# OIDC (aws-actions/configure-aws-credentials) grant `id-token: write` at the
# job level below; every other job runs with the read-only default.
permissions:
  contents: read

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Upload backend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-dist
          path: backend/dist

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build
    # OIDC: assumes AWS_DEPLOY_ROLE_ARN via configure-aws-credentials.
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infrastructure
    outputs:
      frontend_bucket: ${{ steps.outputs.outputs.frontend_bucket }}
      cloudfront_id: ${{ steps.outputs.outputs.cloudfront_id }}
      site_url: ${{ steps.outputs.outputs.site_url }}
      api_url: ${{ steps.outputs.outputs.api_url }}
      cognito_user_pool_id: ${{ steps.outputs.outputs.cognito_user_pool_id }}
      dynamodb_table_name: ${{ steps.outputs.outputs.dynamodb_table_name }}
      web_push_vapid_public_key: ${{ steps.outputs.outputs.web_push_vapid_public_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Terraform Init (isolated staging state)
        # Staging gets its OWN state key so it can never apply onto prod's state.
        run: terraform init -backend-config="key=staging/terraform.tfstate"

      - name: Terraform Plan
        env:
          TF_VAR_git_sha: ${{ github.sha }}
          TF_VAR_web_push_vapid_public_key: ${{ vars.STAGING_WEB_PUSH_VAPID_PUBLIC_KEY }}
          TF_VAR_web_push_vapid_private_key: ${{ secrets.STAGING_WEB_PUSH_VAPID_PRIVATE_KEY }}
          TF_VAR_web_push_vapid_subject: ${{ vars.STAGING_WEB_PUSH_VAPID_SUBJECT }}
          TF_VAR_plant_id_api_key: ${{ secrets.STAGING_PLANT_ID_API_KEY }}
          TF_VAR_openweather_api_key: ${{ secrets.STAGING_OPENWEATHER_API_KEY }}
          TF_VAR_sentry_dsn: ${{ secrets.STAGING_BACKEND_SENTRY_DSN }}
          TF_VAR_sentry_traces_sample_rate: ${{ vars.STAGING_SENTRY_TRACES_SAMPLE_RATE || '0.1' }}
          TF_VAR_posthog_key: ${{ secrets.STAGING_POSTHOG_KEY }}
          TF_VAR_posthog_host: ${{ vars.STAGING_POSTHOG_HOST || 'https://us.i.posthog.com' }}
          # Stripe TEST-mode credentials. Staging is where the paid flow is
          # verified before production is considered; these must be sk_test_ /
          # whsec_ values from the same Stripe test mode as the price ids in
          # environments/staging/terraform.tfvars.
          TF_VAR_stripe_secret_key: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}
        run: terraform plan -var-file=environments/staging/terraform.tfvars -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Get outputs
        id: outputs
        run: |
          {
            echo "frontend_bucket=$(terraform output -raw frontend_bucket_name)"
            echo "cloudfront_id=$(terraform output -raw cloudfront_distribution_id)"
            echo "site_url=$(terraform output -raw site_url)"
            echo "api_url=$(terraform output -raw api_url)"
            echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)"
            echo "dynamodb_table_name=$(terraform output -raw dynamodb_table_name)"
            echo "web_push_vapid_public_key=$(terraform output -raw web_push_vapid_public_key)"
          } >> "$GITHUB_OUTPUT"

  build-frontend:
    name: Build Frontend Against Deployed Staging
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend with Terraform API output
        working-directory: frontend
        env:
          VITE_API_URL: ${{ needs.terraform.outputs.api_url }}
          VITE_VAPID_PUBLIC_KEY: ${{ needs.terraform.outputs.web_push_vapid_public_key }}
          VITE_SENTRY_DSN: ${{ secrets.STAGING_FRONTEND_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ secrets.STAGING_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.STAGING_POSTHOG_HOST || 'https://us.i.posthog.com' }}
          VITE_GTM_ID: ${{ vars.STAGING_GTM_ID }}
          VITE_GIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [terraform, build-frontend, deploy-backend]
    # OIDC: assumes AWS_DEPLOY_ROLE_ARN via configure-aws-credentials.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download frontend artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: dist

      - name: Sync to S3
        run: |
          aws s3 sync dist s3://${{ needs.terraform.outputs.frontend_bucket }} \
            --delete \
            --cache-control "max-age=31536000,public" \
            --exclude "index.html" \
            --exclude "sw.js" \
            --exclude "push-handler.js" \
            --exclude "*.json"

          aws s3 cp dist/index.html s3://${{ needs.terraform.outputs.frontend_bucket }}/index.html \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate"
          aws s3 cp dist/sw.js s3://${{ needs.terraform.outputs.frontend_bucket }}/sw.js \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate"
          aws s3 cp dist/push-handler.js s3://${{ needs.terraform.outputs.frontend_bucket }}/push-handler.js \
            --cache-control "max-age=0,no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        env:
          CLOUDFRONT_ID: ${{ needs.terraform.outputs.cloudfront_id }}
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_ID" \
            --id "$INVALIDATION_ID"

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [terraform, build-frontend]
    # OIDC: assumes AWS_DEPLOY_ROLE_ARN via configure-aws-credentials.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download backend artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-dist
          path: dist

      - name: Deploy Lambda functions
        run: |
          set -euo pipefail
          # See cd-production.yml for the explanation of why we repackage
          # each bundle as `handler.mjs`.
          for handler in auth plants tasks households me notifications billing species climate apiKeys api reminders chat digests chat-stream; do
            FUNCTION_NAME="family-greenhouse-${handler}-staging"
            SRC="dist/${handler}.js"
            test -f "$SRC" || { echo "Missing bundle: $SRC"; exit 1; }
            WORK=$(mktemp -d)
            cp "$SRC" "${WORK}/handler.mjs"
            [ -f "${SRC}.map" ] && cp "${SRC}.map" "${WORK}/handler.mjs.map" || true
            (cd "$WORK" && zip -q -r "/tmp/${handler}.zip" .)
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file "fileb:///tmp/${handler}.zip" \
              --publish > /dev/null
            aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
            echo "  ✓ ${FUNCTION_NAME}"
            rm -rf "$WORK" "/tmp/${handler}.zip"
          done

      - name: Smoke test (public route proves routing + dispatch are live)
        env:
          API_URL: ${{ needs.terraform.outputs.api_url }}
        run: |
          url="${API_URL}/health"
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$url")
          echo "GET /health -> $code"
          cat /tmp/health.json
          test "$code" = "200" || { echo "Smoke test failed"; exit 1; }
          node -e "const h=require('/tmp/health.json'); if(h.status!=='ok'||h.components?.database?.status!=='ok') process.exit(1)"

  e2e-tests:
    name: Post-deploy smoke (Playwright e2e against staging)
    runs-on: ubuntu-latest
    needs: [terraform, deploy-frontend, deploy-backend]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        # This job holds `id-token: write`; per CICD-24 it stays cache-free.
        # setup-node v7 turns package-manager caching on by default, so
        # cache-free is now declared explicitly.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Configure AWS credentials (Cognito and DynamoDB smoke cleanup)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deployed critical-path smoke
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ needs.terraform.outputs.site_url }}
          E2E_API_URL: ${{ needs.terraform.outputs.api_url }}
          E2E_USER_POOL_ID: ${{ needs.terraform.outputs.cognito_user_pool_id }}
          E2E_TABLE_NAME: ${{ needs.terraform.outputs.dynamodb_table_name }}
          E2E_PUBLIC_SIGNUP_EMAIL_TEMPLATE: ${{ secrets.E2E_PUBLIC_SIGNUP_EMAIL_TEMPLATE }}
        run: npx playwright test --config tests/e2e/playwright.smoke.config.ts

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend, e2e-tests]
    if: always()
    steps:
      - name: Deployment notification
        run: |
          if [ "${{ needs.deploy-frontend.result }}" == "success" ] && [ "${{ needs.deploy-backend.result }}" == "success" ] && [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "Staging deployment successful!"
          else
            echo "Staging deployment failed! (frontend=${{ needs.deploy-frontend.result }} backend=${{ needs.deploy-backend.result }} e2e=${{ needs.e2e-tests.result }})"
            exit 1
          fi
