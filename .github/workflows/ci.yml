name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on a pull request — pushing again to a PR makes the
  # previous run's verdict irrelevant, and that is what this setting is for.
  #
  # Never cancel on `main`. A push to `main` is the only CI run that ever tests
  # that exact squashed commit, and cancelling it leaves the commit on `main`
  # with no completed result — the branch has a gap in its record rather than a
  # green one. Because `cancel-in-progress` was unconditional and the group key
  # is just the ref, every merge cancelled the previous merge's run: measured
  # 2026-09-04 over the 33 most recent `main` pushes, 16 of them (48%) ended
  # `cancelled`, so nearly half of `main`'s commits carried no finished verdict
  # from the workflow that holds nine of the repository's required checks.
  #
  # PR runs still cancel, so the fast-iteration benefit is unchanged. The cost
  # is that consecutive merges now run concurrently instead of superseding each
  # other; Actions minutes are free on this public repository, and total
  # job-minutes are unchanged — only whether the work is thrown away.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # commitlint needs both the base and head commits in its range;
          # the default shallow clone (fetch-depth 1) leaves the base SHA
          # missing and fails with "Invalid revision range".
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: No bare TODO/FIXME/HACK markers
        # Shared with `npm run verify` (scripts/check-no-bare-markers.mjs) so
        # local pre-push and CI run the identical check — see CICD-27.
        run: node scripts/check-no-bare-markers.mjs

      - name: No silenced test/security/lint gates in workflows (P0-3)
        # Regression gate for the exact bypasses this remediation pass closed
        # (cd-staging.yml's continue-on-error on e2e; the skip-lighthouse
        # label). See scripts/check-no-silenced-gates.mjs.
        run: node scripts/check-no-silenced-gates.mjs

      - name: Check formatting
        run: npm run format:check

      - name: Verify API spec covers every handler route
        run: node scripts/check-api-spec.mjs

      - name: Verify docs/testing.md matches the suite it documents
        # Shared with `npm run verify` (scripts/check-docs-testing.mjs) so local
        # pre-push and CI run the identical check — see CICD-27. Guards the
        # test-file counts and the coverage-enforcement claims, which had
        # drifted to the point of telling contributors that coverage was "not
        # enforced" while three gates were enforcing it.
        run: node scripts/check-docs-testing.mjs

      - name: Verify observability and SLO contract
        run: npm run observability:check

      - name: Settled-read-state ratchet (a failed read must not render as an all-clear)
        # ADR 0010. Shared with `npm run verify` (root `reads:check`) so local
        # pre-push and CI run the identical check — the same both-places
        # pattern as check-no-bare-markers.mjs (CICD-27). Lives in the required
        # `Lint` job rather than the unrequired `i18n Gates` job, so it can
        # actually block a merge.
        run: npm run reads:check

      - name: Store release readiness (native version parity + listing metadata)
        # `npm run mobile:validate` existed but nothing ran it, so the only
        # thing keeping the native projects in step with package.json was
        # remembering to do it by hand. That failed: v0.23.1/.2/.3 each bumped
        # the workspaces and left android/build.gradle + the Xcode project on
        # 0.23.0 (build 2300), so the script was red on main and nobody saw it.
        # A stale versionCode is not a cosmetic drift — Play rejects a reused
        # one, and it is discovered at upload time, after the release build.
        # Runs the default (non-`--production`, non-`--synced`) mode, which
        # needs no signing material, no populated .env, and no `cap sync`
        # output, so it is safe on a plain CI checkout.
        run: npm run mobile:validate

      - name: Validate commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  i18n:
    name: i18n Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Catalog gates (key parity, placeholder parity, plural categories, TODO markers, BCP-47, UTF-8)
        # STANDARDS/INTERNATIONALIZATION-STANDARD.md §4 G1/G3/G5/G6 —
        # shared with `npm run verify` (frontend `i18n:check`) so local == CI.
        working-directory: frontend
        run: node scripts/check-i18n-catalogs.mjs

      - name: Hardcoded-string ratchet (no new untranslatable JSX text)
        # §4 G2 as a ratchet against scripts/i18n-hardcoded-baseline.json —
        # existing debt is pinned per file and may only shrink.
        working-directory: frontend
        run: node scripts/check-hardcoded-strings.mjs

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check - Frontend
        working-directory: frontend
        run: npm run typecheck

      - name: TypeScript check - Backend
        working-directory: backend
        run: npm run typecheck

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        working-directory: backend
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so gitleaks scans every commit, not just the tip —
          # a secret committed then removed still needs to be caught.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (high+critical gate the build)
        # Scoped to `--omit=dev` because dev tooling (vitest, vite, esbuild)
        # carries advisories that don't ship to prod and that we've chosen
        # to defer (the vite upgrade path is breaking; tracked alongside
        # the vite-6 migration). Critical CVEs in runtime deps still block.
        run: npm audit --omit=dev --audit-level=high

      - name: Run Gitleaks (license-free CLI, blocking)
        # Run the MIT-licensed binary directly so the gate stays independent
        # of repository visibility and action-wrapper licensing. A non-zero
        # exit blocks the build; `--redact` keeps any match out of the log.
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    # Semgrep OSS is free and tokenless — kept as a fast, always-on first pass.
    # CodeQL runs separately for this public repository in codeql.yml
    # (see SEC-08).
    # Runs the community rulesets relevant to our stack and gates on
    # ERROR-severity findings only — high-confidence issues, low
    # false-positive noise. Tune the rulesets / severity as the codebase grows.
    container:
      # Pinned by digest (zizmor `unpinned-images`): a bare `semgrep/semgrep`
      # resolves `:latest` at job start, so the SAST gate could silently swap
      # rule engines between two runs of the same commit. This digest is the
      # one `:latest` resolved to when the pin was taken (semgrep 1.175.0), so
      # the gate keeps running exactly the image it ran before.
      # Bump deliberately: `docker buildx imagetools inspect semgrep/semgrep:<ver>`.
      image: semgrep/semgrep:1.175.0@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Semgrep scan
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --config p/secrets \
            --severity ERROR \
            --error \
            --metrics off

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  build:
    name: Build
    runs-on: ubuntu-latest
    # No `needs:`. This job consumes nothing that lint/typecheck/test produce —
    # it checks out, installs, and builds from source like every other job — so
    # depending on them bought no correctness, only latency: `Build` used to sit
    # idle until the slowest gate (`Test Frontend`, ~320s) finished, and the
    # three jobs behind it then queued another ~320s later. Measured on run
    # 33914673891: everything parallel finished by t+322s, `Build` ran
    # t+322..389s, and E2E/Lighthouse/Bundle size only started at t+392s, for
    # ~706s of wall clock.
    #
    # Nothing is skipped and nothing is weakened. `Build`, `Lint`, `Type Check`,
    # `Test Frontend` and `Test Backend` are all in the `protect-main` ruleset's
    # required-status-checks list, so the merge is blocked by the checks
    # themselves, not by the job graph — a red test still blocks the merge
    # exactly as before. The only behaviour change is that a broken build is now
    # reported alongside a failing test instead of after it, and a run whose
    # tests fail also spends the runner minutes to build. Actions minutes are
    # free on this public repository, so that costs nothing.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Upload backend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-dist
          path: backend/dist

  lighthouse:
    name: Lighthouse (mobile + desktop)
    runs-on: ubuntu-latest
    # No `needs: [build]`. This job never downloaded the `frontend-dist`
    # artifact — it runs its own `npm run build` below — so the dependency was
    # pure serialized waiting. It is its own required status check, so it still
    # has to pass before the branch can merge.
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Need the merge-base/previous commit to diff against — see the
          # "Determine whether frontend changed" step below.
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether frontend changed
        # P0-3 fix: this job used to be skippable on any PR via a human-applied
        # "skip-lighthouse" label — an undocumented, unaudited bypass of the
        # only perf+a11y gate (OBS-23/24/25, A11Y-02). Replaced with an
        # automatic, un-label-able path check: the job always runs when the
        # diff touches frontend/** (or this workflow file), and no label can
        # override that. When the diff genuinely doesn't touch the frontend
        # (docs-only, backend-only, infra-only PRs), the run steps below no-op
        # instead — same speed benefit, no manual escape hatch.
        id: diff
        run: |
          BEFORE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # No usable base to diff against (e.g. a new branch's first push) —
            # fail open (run Lighthouse) rather than silently skip it.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qE '^(frontend/|\.github/workflows/ci\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.diff.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: steps.diff.outputs.changed == 'true'
        run: npm ci

      - name: Build frontend
        if: steps.diff.outputs.changed == 'true'
        working-directory: frontend
        run: npm run build

      - name: Run Lighthouse (${{ matrix.profile }})
        if: steps.diff.outputs.changed == 'true'
        working-directory: frontend
        run: npm run lighthouse:${{ matrix.profile }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-${{ matrix.profile }}
          path: frontend/.lighthouseci/${{ matrix.profile }}
          if-no-files-found: ignore

  bundle-size:
    name: Bundle size
    runs-on: ubuntu-latest
    # No `needs: [build]` — same reason as `lighthouse`: this job builds the
    # frontend itself rather than downloading `frontend-dist`, so waiting for
    # `Build` measured the same bundle a minute later. Still a required check.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check bundle sizes
        working-directory: frontend
        run: npm run size

  e2e-shard:
    name: E2E shard
    runs-on: ubuntu-latest
    # No `needs: [build]` — #499 removed it, and it stays removed. Playwright's
    # `webServer` block builds and previews the frontend itself, so this job
    # starts at t+0. Reusing the `Build` job's `frontend-dist` artifact instead
    # was measured and rejected: `Build` finishes ~67s in, and downloading it
    # saves only the ~18s rebuild, so `needs: [build]` would cost ~47s net.
    #
    # #499 took this job off the critical path's *tail position*; it did not
    # make it fast. It was still ~314s of wall clock, 260s of which was 109
    # tests on a single Playwright worker. Splitting `--shard=N/4` across four
    # runners is the part that makes it fast.
    #
    # Why sharding and not `workers: > 1` inside one job: the local backend
    # boots ONE in-memory DB per server, and specs that touch the well-known
    # seed account (test@example.com) race each other when they run
    # concurrently against it — the collision that `tests/e2e/helpers.ts` was
    # written to document. Each shard is a separate runner with its own backend
    # and its own fresh seed, so partitioning across shards cannot reintroduce
    # that race, while raising in-job workers would. Each shard stays at one
    # worker.
    strategy:
      # Every shard reports; a failure in shard 2 must not hide a different
      # failure in shard 4. The gate job below is what turns these into one
      # required check.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve the installed Playwright version
        # Keyed off the version npm actually installed from the lockfile, not a
        # hand-copied string: a lockfile bump then misses the cache and
        # redownloads, which is the correct behaviour. Browser builds are
        # version-locked to the client, so a stale cache would fail loudly
        # ("Executable doesn't exist"), never silently run the wrong browser.
        id: playwright
        run: |
          set -euo pipefail
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        # The cache holds the browser build, not the apt packages it links
        # against, so the OS deps are still installed on a cache hit — this is
        # the cheap half of the ~27s the full install cost.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run e2e + a11y suite (shard ${{ matrix.shard }} of 4)
        working-directory: frontend
        env:
          SHARD: ${{ matrix.shard }}
        run: npm run test:e2e -- --project=chromium --shard="$SHARD/4" --reporter=blob

      - name: Upload shard blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: frontend/blob-report
          if-no-files-found: ignore

  e2e-a11y:
    # Name is load-bearing: `E2E + accessibility (Playwright)` is a required
    # status check on `main`. Sharding renames the job that does the work to
    # `E2E shard (N)`, so this aggregate keeps the required context reporting
    # and the ruleset needs no edit. It is deliberately a real gate, not a
    # formality — it fails whenever the shard matrix is anything but wholly
    # successful, including cancelled and skipped, so there is no result value
    # that lets a broken suite through.
    name: E2E + accessibility (Playwright)
    runs-on: ubuntu-latest
    needs: [e2e-shard]
    if: always()
    steps:
      - name: Require every E2E shard to have passed
        env:
          SHARDS_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          set -euo pipefail
          echo "E2E shard matrix result: $SHARDS_RESULT"
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "::error::E2E shards did not all pass (aggregate result: $SHARDS_RESULT)."
            exit 1
          fi

  e2e-report:
    # Merges the four shard blobs back into the single HTML report this job used
    # to publish, and prints the executed/skipped totals so a shard silently
    # dropping tests is visible in the log. That printout is also the standing
    # evidence that `visual-regression.spec.ts`'s ten specs are skipped in CI
    # (#472) — today that fact is invisible unless you open the report.
    #
    # Not a required check: it produces an artifact, so keeping it off the
    # required list means report generation never sits on merge latency. The
    # pass/fail decision lives entirely in `e2e-a11y` above.
    name: E2E report (merged)
    runs-on: ubuntu-latest
    needs: [e2e-shard]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download shard blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-blob-*
          merge-multiple: true
          path: all-blob-reports

      - name: Merge into one HTML report
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Report the executed test totals
        # The suite is sharded, so "did every test still run?" is no longer
        # answerable from one job's summary. Merge to JSON and print the counts.
        # Deliberately printed rather than asserted against a hand-written
        # expected number: a checked-in test-count constant is the kind of gate
        # that makes every test-adding PR rewrite the same line and jams the
        # merge queue (see the note in docs/testing.md about this file's own
        # retired Files column).
        run: |
          set -euo pipefail
          npx playwright merge-reports --reporter json ./all-blob-reports > merged.json
          node -e '
            const s = JSON.parse(require("fs").readFileSync("merged.json", "utf8")).stats;
            console.log(`expected(passed)=${s.expected} unexpected(failed)=${s.unexpected} flaky=${s.flaky} skipped=${s.skipped} total=${s.expected + s.unexpected + s.flaky + s.skipped}`);
          '

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
