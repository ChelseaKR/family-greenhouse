name: CodeQL

# Family Greenhouse is a public repository, so CodeQL uploads findings to the
# repository's code-scanning view without requiring GitHub Advanced Security.
on:
  # No `push: main` trigger (CI-CD-STANDARD §11e): every commit reaching main
  # goes through a PR, so the pull_request run already analyzed it, and the
  # weekly schedule (running on main) keeps default-branch code-scanning
  # results fresh against new query packs. A push:main run would re-spend the
  # multi-minute CodeQL analysis on code the PR run just covered.
  pull_request:
    branches: [main]
  schedule:
    # Weekly, independent of push/PR activity — catches newly-published CodeQL
    # query-pack findings against unchanged code, not just new commits.
    - cron: '17 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL analysis (javascript-typescript, actions)
    runs-on: ubuntu-latest
    permissions:
      # Analyze Actions workflows alongside JavaScript/TypeScript sources.
      actions: read
      contents: read
      # Publish SARIF findings to the public repository's code-scanning view.
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        # javascript-typescript and actions are both interpreted languages
        # (no compile step) — build-mode: none covers both in one run.
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript, actions
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
