name: OpenSSF Scorecard

# Closes the "OpenSSF Scorecard" gap declared in docs/roadmap.md's metrics
# ledger (CICD-29): supply-chain posture score (branch protection, pinned
# actions, dependency update tooling, etc.) published to the public
# Scorecard API and uploaded to this repo's code-scanning tab. Public repo,
# so no PAT is needed — `publish_results: true` authenticates via OIDC
# (`id-token: write`) and the default `GITHUB_TOKEN` covers repo reads.
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    # Weekly — Scorecard results drift with unrelated repo/org config
    # changes (branch protection, token permissions), not just commits.
    - cron: '30 6 * * 1'

# Cancel superseded runs (CI-CD-STANDARD §11c): a rapid series of pushes to
# main only needs the newest Scorecard analysis — earlier queued/in-flight
# runs are stale the moment a newer commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results to code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
