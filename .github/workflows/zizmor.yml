name: zizmor

# Closes the "zizmor (workflow SAST)" gap declared in docs/roadmap.md's
# metrics ledger (CICD-29): static analysis of our own GitHub Actions
# workflows for injection risks, unpinned actions, overbroad permissions,
# etc. Results upload to the repository's code-scanning view, which is
# available without GitHub Advanced Security because the repository is public.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, independent of push/PR activity — catches newly-published
    # zizmor audit rules against unchanged workflow files.
    - cron: '23 6 * * 1'

concurrency:
  # Per commit on a push, per ref on a pull request. A group holds one running
  # run and one pending run; keyed on the ref alone every commit on main shares a
  # slot and a third push evicts the second before it dispatches a job -- an
  # absent verdict, not a red one. Pull requests keep the per-ref key so a new
  # push to a branch still supersedes the run it replaced.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    name: zizmor workflow audit
    runs-on: ubuntu-latest
    permissions:
      # Inspect workflow metadata and checked-in workflow definitions.
      actions: read
      contents: read
      # Publish workflow-audit SARIF to the public code-scanning view.
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
