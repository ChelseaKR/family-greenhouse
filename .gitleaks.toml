# Gitleaks config for Family Greenhouse.
# Extends the upstream default ruleset and adds a narrow allowlist for the
# dev/test bearer-token format, which appears in docs and test fixtures and
# is NOT a real credential (the local Express mock accepts `mock-token-*`
# instead of a Cognito JWT — see backend/src/local-server.ts).
[extend]
useDefault = true

[allowlist]
description = "Dev/test mock bearer tokens (local-server.ts auth shim), not real secrets, plus generated build output that is never committed"
# `paths` exists for the WORKING-TREE scan (`gitleaks detect --no-git`, added
# to CI on 2026-08-28). That mode walks the filesystem, so it sees build
# output and local worktrees that the history scan never sees because they
# are gitignored and were never committed. Without these, the working-tree
# scan reported 96 findings, every one of them inside `backend/dist` or
# `.claude/worktrees/*/backend/dist` — bundled third-party code, no secret of
# ours. A permanently-red gate gets ignored and then removed, so the noise is
# excluded by path rather than by lowering the rules.
#
# CAUTION, and the reason scripts/check-secret-scan-coverage.mjs exists:
# gitleaks has ONE allowlist, not one per scan mode. Every pattern below
# applies to `detect --source .` (history) exactly as much as it applies to
# `detect --no-git` (working tree). So a pattern that matches a TRACKED file
# does not merely quieten filesystem noise, it deletes that file from the only
# secret gate this repo has, in both directions at once.
#
# That is not hypothetical. An earlier revision of this branch also listed
# `(^|/)frontend/(android|ios)/`, which matches 76 tracked files, including
# `frontend/android/gradle.properties` and `frontend/ios/debug.xcconfig` —
# precisely where signing credentials and mobile API keys live. Measured with
# gitleaks 8.30.1, the version CI installs: a synthetic GitHub PAT committed
# to `frontend/android/gradle.properties` was caught by `main`'s config
# (exit 1) and reported "no leaks found" (exit 0) by that revision, in BOTH
# scan modes. The pattern also suppressed nothing: with it removed, the
# working-tree scan still finds 0 findings.
#
# The invariant every pattern here must satisfy: it may match only paths that
# are gitignored and therefore never tracked. `npm run secrets:coverage`
# fails the build if any pattern below matches a file `git ls-files` reports.
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)build/''',
  '''(^|/)coverage/''',
  '''(^|/)\.claude/worktrees/''',
  '''(^|/)\.lighthouseci/''',
  '''(^|/)playwright-report/''',
  '''(^|/)test-results/''',
]
regexes = [
  '''mock-token-[0-9a-fA-F-]+''',
]
