# Gitleaks config for Family Greenhouse.
# Extends the upstream default ruleset and adds a narrow allowlist for the
# dev/test bearer-token format, which appears in docs and test fixtures and
# is NOT a real credential (the local Express mock accepts `mock-token-*`
# instead of a Cognito JWT — see backend/src/local-server.ts).
[extend]
useDefault = true

[allowlist]
description = "Dev/test mock bearer tokens (local-server.ts auth shim) — not real secrets"
regexes = [
  '''mock-token-[0-9a-fA-F-]+''',
]
# Generated trees. Needed once the scan also runs in FILE mode (`--no-git`,
# see scripts/check-secrets.mjs and #442): git mode never saw these because
# they are gitignored and therefore never in a commit, but a file walk reads
# whatever is on disk — which after `npm ci` is tens of thousands of
# dependency files, including their own test fixtures. None of it is this
# repo's content and none of it can be committed, so scanning it would buy
# noise, not coverage. Measured: with these exclusions a file-mode scan of a
# full working tree reads 12.34 MB in 6.7s, the same as a clean checkout.
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)(dist|dist-ssr|build|out)/''',
  '''(^|/)(coverage|test-results|playwright-report|blob-report|\.nyc_output|\.lighthouseci)/''',
  '''(^|/)\.terraform/''',
]
