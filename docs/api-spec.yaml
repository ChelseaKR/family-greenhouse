openapi: 3.0.3
info:
  title: Family Greenhouse API
  description: API for collaborative plant care management
  version: 1.0.0
  contact:
    name: Family Greenhouse Team

servers:
  - url: https://api.family-greenhouse.example.com
    description: Production
  - url: https://api-staging.family-greenhouse.example.com
    description: Staging

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Unauthenticated liveness probe (status + build SHA)
      tags: [System]
      security: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /telemetry/frontend:
    post:
      summary: Record a sanitized browser error or Core Web Vital
      tags: [System]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrontendTelemetryEvent'
      responses:
        '204': { description: Recorded }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { description: Rate limited }
  /telemetry/product:
    post:
      summary: Record an authenticated, typed product event
      tags: [System]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductTelemetryEvent'
      responses:
        '204': { description: Recorded }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Rate limited }
  /auth/signup:
    post:
      summary: Register a new free-tier user
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Rate limited
        '503':
          description: Public registration is disabled by repository status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/login:
    post:
      summary: Authenticate user
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /spaces:
    get:
      summary: List household plant spaces
      tags: [Spaces]
      responses:
        '200':
          description: Household spaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantSpace'
    post:
      summary: Create a household plant space
      tags: [Spaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpaceRequest'
      responses:
        '201':
          description: Space created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantSpace'
        '409':
          description: A space with that name already exists

  /spaces/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Update a household plant space
      tags: [Spaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSpaceRequest'
      responses:
        '200':
          description: Space updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantSpace'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete an empty household plant space
      tags: [Spaces]
      responses:
        '204':
          description: Space deleted
        '409':
          description: The space still contains plants

  /plants:
    get:
      summary: List all plants
      tags: [Plants]
      responses:
        '200':
          description: List of plants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plant'
    post:
      summary: Create a new plant
      tags: [Plants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlantRequest'
      responses:
        '201':
          description: Plant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'

  /plants/move:
    post:
      summary: Move one or more plants to a household space
      description: Moves up to 50 unique plants atomically. A null spaceId places them in Unplaced.
      tags: [Plants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovePlantsRequest'
      responses:
        '200':
          description: Moved plants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plant'
        '404':
          $ref: '#/components/responses/NotFound'

  /plants/{id}:
    get:
      summary: Get plant details
      tags: [Plants]
      parameters:
        - $ref: '#/components/parameters/PlantId'
      responses:
        '200':
          description: Plant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantWithTasks'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update plant
      tags: [Plants]
      parameters:
        - $ref: '#/components/parameters/PlantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlantRequest'
      responses:
        '200':
          description: Plant updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
    delete:
      summary: Delete plant
      tags: [Plants]
      parameters:
        - $ref: '#/components/parameters/PlantId'
      responses:
        '204':
          description: Plant deleted

  /tasks:
    get:
      summary: List tasks
      tags: [Tasks]
      parameters:
        - name: plantId
          in: query
          schema:
            type: string
            format: uuid
        - name: assignedTo
          in: query
          schema:
            type: string
            format: uuid
        - name: dueWithin
          in: query
          schema:
            type: integer
        - name: overdue
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      summary: Create a new task
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

  /tasks/{id}/complete:
    post:
      summary: Mark task as complete
      description: >-
        Advances the schedule and writes one completion row. On Garden and
        Greenhouse (household toolkit), if another member completed the same
        task — or the same plant + care type — inside the care type's
        detection window (24h for watering, longer for slower care; set
        server-side), the endpoint answers 409 with
        `details.code = DUPLICATE_CARE` and logs NOTHING. Re-submit with
        `confirmDuplicate: true` to log it anyway; that row is tagged with
        the completion it duplicates and counted in the monthly analytics.
      tags: [Tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                expectedNextDue:
                  type: string
                  format: date-time
                  description: Occurrence token; a stale value makes the call a no-op.
                confirmDuplicate:
                  type: boolean
                  description: Log the completion even though it duplicates another member's.
      responses:
        '200':
          description: Task completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '409':
          description: >-
            Suspected double-care; nothing was logged. `details.duplicate`
            carries who completed it, when, the task id / care type, whether it
            was the very same task, and the window in hours.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  details:
                    type: object
                    properties:
                      code: { type: string, enum: [DUPLICATE_CARE] }
                      plantName: { type: string }
                      duplicate:
                        type: object
                        properties:
                          completionId: { type: string }
                          completedAt: { type: string, format: date-time }
                          completedBy: { type: string }
                          completedByName: { type: string }
                          taskId: { type: string }
                          taskType: { type: string }
                          sameTask: { type: boolean }
                          windowHours: { type: integer }

  /tasks/{id}/match-schedule:
    post:
      summary: >-
        One-tap "match the schedule to reality" from a schedule-drift
        suggestion (household toolkit). The server recomputes the drift, sets
        the frequency to the median real interval, re-derives the next due
        date from the last completion, and audits a `task.schedule_matched`
        activity event.
      tags: [Tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '402': { description: Tier lacks the household toolkit }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          { description: No drift to match (schedule already matches, or fewer than 4 completions) }
        '503': { description: Plan or completion history could not be read; nothing changed }

  /sitter/{token}:
    get:
      summary: Public plant-sitter view — due/overdue tasks for a time-boxed link. No auth; token is the only credential. Returns only task essentials plus current space and placement note; never household climate location, private notes, or member data.
      tags: [Tasks]
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Due tasks for the sitter (PII-free projection)
          content:
            application/json:
              schema:
                type: object
                properties:
                  label: { type: string, nullable: true }
                  expiresAt: { type: string, format: date-time }
                  briefAvailable:
                    type: boolean
                    description: "Whether this household's plan includes the handoff brief. False means the brief endpoint answers its generic 404 for this link."
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        taskId: { type: string }
                        plantName: { type: string }
                        taskType: { type: string }
                        dueDate: { type: string, format: date-time }
                        spaceName: { type: string, nullable: true }
                        placementNote: { type: string, nullable: true }
                        overdue: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }

  /sitter/{token}/brief:
    get:
      summary: Public plant-sitter handoff brief — the same household plant by plant (space, placement note, the household's own care words, the verified pet-toxicity entry, latest photo, and tasks due inside the link window). No auth; the token is the only credential. Included from the Garden plan up; on a plan without it, and for an invalid/expired token alike, the response is the same generic 404.
      tags: [Tasks]
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The handoff brief (PII-free projection)
          content:
            application/json:
              schema:
                type: object
                properties:
                  label: { type: string, nullable: true }
                  startsAt: { type: string, format: date-time }
                  expiresAt: { type: string, format: date-time }
                  plants:
                    type: array
                    items:
                      type: object
                      properties:
                        plantId: { type: string }
                        name: { type: string }
                        spaceName: { type: string, nullable: true }
                        placementNote: { type: string, nullable: true }
                        careNote:
                          type: string
                          nullable: true
                          description: "The household's own care words; null when they wrote none. Never generated."
                        careNoteSource: { type: string, nullable: true, enum: [rule, notes] }
                        photoUrl: { type: string, nullable: true }
                        petSafety:
                          type: object
                          nullable: true
                          description: 'Entry from the curated, ASPCA-grounded table. Null means no verdict, never safe.'
                          properties:
                            slug: { type: string }
                            commonName: { type: string }
                            scientificName: { type: string }
                            cats: { type: string, enum: [toxic, non-toxic] }
                            dogs: { type: string, enum: [toxic, non-toxic] }
                            note: { type: string }
                            matchedOn: { type: string }
                        tasks:
                          type: array
                          items:
                            type: object
                            properties:
                              taskId: { type: string }
                              taskType: { type: string }
                              dueDate: { type: string, format: date-time }
                              overdue: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }

  /sitter/{token}/tasks/{taskId}/complete:
    post:
      summary: Public plant-sitter task completion. Validates the token and that the task belongs to the token's household; attributed as "a plant sitter". No auth, no PII.
      tags: [Tasks]
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Task completed (PII-free projection)
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId: { type: string }
                  plantName: { type: string }
                  taskType: { type: string }
                  dueDate: { type: string, format: date-time }
                  spaceName: { type: string, nullable: true }
                  placementNote: { type: string, nullable: true }
                  overdue: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }

  /kiosk/{token}:
    get:
      summary: Public kiosk (wall display) view — today's due/overdue tasks for a long-lived household token, plus the poll interval the display should use. No auth; the token is the only credential. Same PII-free projection as the sitter view. A read failure is a 5xx, never an empty list.
      tags: [Tasks]
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Today's tasks for the kiosk (PII-free projection)
          content:
            application/json:
              schema:
                type: object
                properties:
                  pollIntervalSeconds: { type: integer, minimum: 60, maximum: 3600 }
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        taskId: { type: string }
                        plantName: { type: string }
                        taskType: { type: string }
                        dueDate: { type: string, format: date-time }
                        spaceName: { type: string, nullable: true }
                        placementNote: { type: string, nullable: true }
                        overdue: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }

  /kiosk/{token}/tasks/{taskId}/complete:
    post:
      summary: Public kiosk task completion. Re-validates the token (so a revoke bites mid-session) and that the task belongs to the token's household; attributed as "the kiosk display". No auth, no PII.
      tags: [Tasks]
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Task completed (PII-free projection)
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId: { type: string }
                  plantName: { type: string }
                  taskType: { type: string }
                  dueDate: { type: string, format: date-time }
                  spaceName: { type: string, nullable: true }
                  placementNote: { type: string, nullable: true }
                  overdue: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }

  /sitter/{token}/photos:
    get:
      summary: Away Kit photo-back status for a sitter link — whether the household's plan includes it and how much of the 60-photo cap is left. No auth; token is the only credential. `used`/`remaining` are null when the count could not be read.
      tags: [Tasks]
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Photo-back availability for this link
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  max: { type: integer, example: 60 }
                  used: { type: integer, nullable: true }
                  remaining: { type: integer, nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Sitter photo-back. Stores one JPEG/PNG/WebP photo (≤ 300 KB decoded, type verified by magic bytes) of the plant behind a task, under the household's photo timeline, attributed to the sitter link. Hard limits, all server-side — 60 photos per link (atomic), 300 KB per file, IP + per-token rate limits, refused once the link has expired or been revoked, refused (402) when the plan lacks the Away Kit. Never replaces the plant's primary image.
      tags: [Tasks]
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId, image]
              properties:
                taskId:
                  {
                    type: string,
                    description: A task from the sitter view; resolved to its plant inside the token's household,
                  }
                image:
                  {
                    type: string,
                    description: Data URL or bare base64 of the image bytes (≤ 409,
                    600 chars),
                  }
                caption: { type: string, maxLength: 200 }
      responses:
        '201':
          description: Photo stored (PII-free acknowledgement)
          content:
            application/json:
              schema:
                type: object
                properties:
                  photoId: { type: string }
                  plantName: { type: string }
                  caption: { type: string, nullable: true }
                  uploadedAt: { type: string, format: date-time }
                  used: { type: integer }
                  remaining: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { description: The household's plan does not include the Away Kit }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The link has reached its 60-photo limit }
        '413': { description: Photo exceeds 300 KB }
        '429': { description: Per-IP or per-token upload rate exceeded }

  /caretaker/{token}:
    get:
      summary: Public caretaker view — the worklist for a named, time-boxed caretaker seat. No auth; the 256-bit token is the only credential. Same PII-free projection as the sitter view, plus the caretaker's own name and their complete permission list.
      tags: [Tasks]
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The caretaker's due tasks (PII-free projection)
          content:
            application/json:
              schema:
                type: object
                properties:
                  caretakerName: { type: string }
                  startsAt: { type: string, format: date-time }
                  expiresAt: { type: string, format: date-time }
                  permissions:
                    type: array
                    items: { type: string, enum: [task.complete, photo.add, note.add] }
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        taskId: { type: string }
                        plantName: { type: string }
                        taskType: { type: string }
                        dueDate: { type: string, format: date-time }
                        spaceName: { type: string, nullable: true }
                        placementNote: { type: string, nullable: true }
                        overdue: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }

  /caretaker/{token}/tasks/{taskId}/complete:
    post:
      summary: Public caretaker task completion, attributed to the caretaker by name and folded into their visit record. `visitRecorded` is false when the task completed but the visit line could not be written.
      tags: [Tasks]
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedNextDue: { type: string, format: date-time }
      responses:
        '200':
          description: Task completed (PII-free projection)
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId: { type: string }
                  plantName: { type: string }
                  taskType: { type: string }
                  dueDate: { type: string, format: date-time }
                  overdue: { type: boolean }
                  visitRecorded: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }

  /caretaker/{token}/notes:
    post:
      summary: Leave a note on the caretaker's current visit. The note IS the record, so a failed write is an error rather than a partial success.
      tags: [Tasks]
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Note recorded on the visit
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
                  at: { type: string, format: date-time }
                  visitRecorded: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }

  /caretaker/{token}/plants/{plantId}/photo:
    post:
      summary: Presign a photo upload for a plant in the caretaker's household. Nothing is attached until /confirm. No auth; the key is minted for this household and plant only.
      tags: [Plants]
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: plantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
      responses:
        '200':
          description: Presigned PUT URL and the public image URL it will have
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl: { type: string }
                  imageUrl: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /caretaker/{token}/plants/{plantId}/photo/confirm:
    post:
      summary: Attach an uploaded photo to the plant's timeline, attributed to the caretaker and recorded on their visit. Verifies the object landed within the 5 MiB cap with an allowed content type.
      tags: [Plants]
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: plantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageUrl]
              properties:
                imageUrl: { type: string }
      responses:
        '200':
          description: Photo attached
          content:
            application/json:
              schema:
                type: object
                properties:
                  imageUrl: { type: string }
                  photo: { type: object }
                  visitRecorded: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /households:
    post:
      summary: Create a new household
      description: >-
        The caller's plan decides how many households they may belong to (`limits.homes`; Seedling
        and Garden include one, Greenhouse is unlimited). The first household is always allowed. A
        caller already at or above the cap keeps every household they have and every right in them
        — only this new one is refused.
      tags: [Households]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHouseholdRequest'
      responses:
        '201':
          description: Household created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '402':
          description: The caller's plan does not include another home
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /households/{id}:
    get:
      summary: Get household details
      tags: [Households]
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Household details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdWithMembers'

  # --- Auth: secondary flows ---
  /auth/confirm:
    post:
      summary: Confirm a new account with the emailed code
      tags: [Auth]
      security: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/resend-code:
    post:
      summary: Resend the email-confirmation code
      tags: [Auth]
      security: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/refresh:
    post:
      summary: Exchange a refresh token for a new access token
      tags: [Auth]
      security: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/forgot-password:
    post:
      summary: Send a password-reset code to the user's email
      tags: [Auth]
      security: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/reset-password:
    post:
      summary: Reset password with the emailed reset code
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/change-password:
    post:
      summary: Change password while authenticated
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      summary: Current authenticated user (identity + display name)
      tags: [Auth]
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  email: { type: string }
                  name: { type: string }
                  householdId: { type: [string, 'null'] }
                  householdRole: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      summary: Update editable profile attributes (currently `name` only)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  email: { type: string }
                  name: { type: string }

  # --- Me ---
  /me:
    delete:
      summary: GDPR self-delete (account + household-membership wipe)
      tags: [Me]
      responses:
        '204': { description: Account deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502':
          description: >-
            The Stripe subscription of a household the caller is the only
            member of could not be cancelled. Nothing was deleted; retry.
  /me/export:
    get:
      summary: GDPR data-portability export (profile, prefs, memberships, plants, tasks)
      tags: [Me]
      responses:
        '200':
          description: Downloadable JSON document of the caller's data
          content:
            application/json:
              schema:
                type: object
  /me/households:
    get:
      summary: All households the caller is a member of
      tags: [Me]
      responses:
        '200':
          description: Household memberships
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
  /me/today:
    get:
      summary: Cross-home Today — due-today and overdue tasks across every household the caller belongs to, grouped by household
      description: |
        A work queue, not a global inventory (ADR 0017). Each household the
        caller is a member of is resolved with that household's membership
        role and returned as its own group with the household name on every
        row; nothing is merged across homes. A household whose read fails is
        returned as an explicit `status: unavailable` entry, never dropped.
        Not pinned to the active household — `X-Household-Id` is ignored for
        the read. Acting on a row goes through the ordinary task routes with
        an explicit `X-Household-Id` for that row's household. Greenhouse
        plan: 402 when no household of the caller's includes it.
      tags: [Me]
      parameters:
        - in: query
          name: until
          required: false
          description: The caller's local end-of-day as an ISO-8601 date-time. Defaults to the end of the UTC day; must be within 48 hours of now.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Due and overdue work, grouped by household
          content:
            application/json:
              schema:
                type: object
                required: [generatedAt, cutoff, households]
                properties:
                  generatedAt: { type: string, format: date-time }
                  cutoff: { type: string, format: date-time }
                  households:
                    type: array
                    items:
                      type: object
                      required: [householdId, name, role, status]
                      properties:
                        householdId: { type: string, format: uuid }
                        name: { type: string, nullable: true }
                        role: { type: string, enum: [admin, member] }
                        status: { type: string, enum: [ok, unavailable] }
                        tasks:
                          description: Present only when status is `ok`. Each row is a task plus `householdName`.
                          type: array
                          items: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402':
          description: No household of the caller's is on a plan that includes cross-home Today
        '503':
          description: Plan entitlement could not be verified; retry later
  /me/calendar.ics:
    get:
      summary: Authenticated one-shot iCalendar download of the active household's tasks. JWT-guarded, so it is NOT a subscription URL — calendar apps carry no session. Subscribe via /calendar/{token}/family-greenhouse.ics instead.
      tags: [Me]
      responses:
        '200':
          description: iCalendar (RFC 5545) document
          content:
            text/calendar:
              schema:
                type: string
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/calendar-token:
    get:
      summary: Whether the caller has a calendar-feed link for the active household (X-Household-Id aware). Never returns the token — it is stored hashed and shown only at mint.
      tags: [Me]
      responses:
        '200':
          description: Link status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarTokenStatus'
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Mint the caller's calendar-feed link for the active household, replacing any existing one (this is also "regenerate" — the previous URL stops working). Returns the token and feed path exactly once. Any member may mint one; it exposes only what they already see.
      tags: [Me]
      responses:
        '201':
          description: The new link — the only time the token is returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CalendarTokenStatus'
                  - type: object
                    properties:
                      token: { type: string, description: '64 lowercase hex chars (256-bit)' }
                      path: { type: string, example: '/calendar/{token}/family-greenhouse.ics' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { description: Rate limited (10/min per user) }
    delete:
      summary: Revoke the caller's calendar-feed link for the active household. 404 when there is none.
      tags: [Me]
      responses:
        '204': { description: Revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /calendar/{token}/family-greenhouse.ics:
    get:
      summary: Public subscribe-able iCalendar feed. No auth — the 256-bit token in the path is the only credential (a capability URL; whoever holds it can read the feed). Scoped to one user's view of one household, read-only, membership re-checked on every fetch. Emits task titles, cadence, and due dates only — never notes, assignees, or member data. IP-rate-limited.
      tags: [Me]
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: iCalendar (RFC 5545) feed
          content:
            text/calendar:
              schema:
                type: string
        '404':
          description: Invalid, revoked, or regenerated link, or the holder is no longer a household member (one generic message)
        '429': { description: Rate limited (60/min per IP) }

  # --- Plants: photos, history, image upload, templates ---
  /plants/{id}/photos:
    get:
      summary: Plant photo timeline
      tags: [Plants]
      parameters: [{ $ref: '#/components/parameters/PlantId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /plants/{plantId}/history:
    get:
      summary: Combined task-completion + photo history for a plant
      tags: [Plants]
      parameters: [{ $ref: '#/components/parameters/PlantIdAlt' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /plants/{id}/image:
    post:
      summary: Issue a presigned S3 upload URL for a plant photo
      tags: [Plants]
      parameters: [{ $ref: '#/components/parameters/PlantId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /plants/{id}/image/confirm:
    post:
      summary: Confirm a photo upload landed and link it to the plant
      tags: [Plants]
      parameters: [{ $ref: '#/components/parameters/PlantId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /plants/{plantId}/apply-template:
    post:
      summary: Apply a recurring task template to a single plant
      tags: [Plants]
      parameters: [{ $ref: '#/components/parameters/PlantIdAlt' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /plants/{plantId}/schedule-drift:
    get:
      summary: >-
        Schedule drift for every task of a plant (household toolkit): the
        median real interval between completions against the scheduled one.
        `drift` is null — with a `reason` — below 4 completions or when the
        history read failed; it is never a fabricated 0% drift.
      tags: [Tasks]
      parameters: [{ $ref: '#/components/parameters/PlantIdAlt' }]
      responses:
        '200':
          description: Per-task drift, or an explicit unavailable/not-in-plan envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  reason:
                    type: string
                    nullable: true
                    enum: [not_in_plan, plan_unavailable, null]
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        taskId: { type: string }
                        scheduledIntervalDays: { type: integer }
                        completionsConsidered: { type: integer }
                        requiredCompletions: { type: integer }
                        drift:
                          type: object
                          nullable: true
                          properties:
                            medianIntervalDays: { type: number }
                            driftPct: { type: number }
                            suggestedFrequency: { type: integer }
                            exceedsThreshold: { type: boolean }
                        reason:
                          type: string
                          nullable: true
                          enum: [insufficient_completions, history_unavailable, null]
        '404': { $ref: '#/components/responses/NotFound' }
  /plants/apply-template-bulk:
    post:
      summary: Apply a task template to up to 50 plants at once
      tags: [Plants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plantIds, templateId]
              properties:
                plantIds:
                  type: array
                  maxItems: 50
                  items: { type: string, format: uuid }
                templateId: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # --- Tasks: detail, snooze, templates, upcoming ---
  /tasks/{id}:
    get:
      summary: Get a single task
      tags: [Tasks]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Update task fields (frequency, assignee, notes, etc.)
      tags: [Tasks]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete a task
      tags: [Tasks]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '204': { description: Task deleted }
  /tasks/upcoming:
    get:
      summary: Tasks due in the near term across the active household
      tags: [Tasks]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /tasks/templates:
    get:
      summary: Public catalog of recurring task templates
      tags: [Tasks]
      security: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /tasks/{id}/snooze:
    post:
      summary: Snooze a task by N days (or skip a cycle)
      tags: [Tasks]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [days]
              properties:
                days: { type: integer, minimum: 1, maximum: 365 }
                reason: { type: string, enum: [rain, frost, heat, other] }
                note: { type: string, maxLength: 200 }
                expectedNextDue:
                  type: string
                  format: date-time
                  description: Echo the task's current nextDue value to make retries idempotent.
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # --- Households: invites, activity, analytics, members ---
  /households/invites/{inviteCode}:
    get:
      summary: Validate an invite code (used by the join landing page)
      tags: [Households]
      security: []
      parameters: [{ $ref: '#/components/parameters/InviteCode' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /households/join/{inviteCode}:
    post:
      summary: Join a household with a valid invite code
      description: >-
        Two plan gates apply. The joined household's member cap (`limits.members`; unlimited on
        Garden and Greenhouse) and the caller's own home cap (`limits.homes`), which is resolved
        against the strongest plan the caller would then hold — so joining a Greenhouse household
        always succeeds however many homes the caller already has.
      tags: [Households]
      parameters: [{ $ref: '#/components/parameters/InviteCode' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402':
          description: The household is at its member cap, or the caller's plan includes no further home
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /households/{id}/invites:
    post:
      summary: Generate a fresh household invite (admin only)
      tags: [Households]
      parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
      responses:
        '201': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /households/{id}/invites/email:
    post:
      summary: Mint an invite and email it to an address (admin only)
      description: >-
        Always returns the invite link alongside `status`, so the caller can
        fall back to copy-and-paste in every failure case. `status` is one of
        `accepted` (SES took the message — acceptance, not delivery),
        `unavailable` (email delivery is not configured),
        `identity_unavailable` (we could not name the inviter or the household,
        so no invitation was sent) or `recipient_cooldown` (this address was
        already invited to this household today). Bounded by a per-household
        daily cap (429) and a per-address cooldown.
      tags: [Households]
      parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                locale:
                  type: string
                  enum: [en, es]
                  description: Language to write the invitation in.
      responses:
        '201': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { description: Daily invite-email allowance for this household is used up }
        '503': { description: The inviter or household name could not be read, so nothing was sent }
  /households/{id}/activity:
    get:
      summary: Recent household activity feed
      tags: [Households]
      parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /households/{id}/analytics/daily:
    get:
      summary: >-
        Daily completion analytics for the last N days, plus `doubleCare` —
        confirmed double-care completions this UTC calendar month on
        household-toolkit tiers (`status: ok` with a count), `not_in_plan`
        otherwise, or `unavailable` when the plan or the log could not be read.
      description: >-
        `days` is clamped to the plan's analytics window (`limits.analyticsHistoryDays`; 30 on the
        free tier, unlimited on paid). The response echoes the window actually served in `days` and
        the plan's ceiling in `historyLimitDays` — a number, or `null` for no ceiling. Only the
        RENDERED range is narrowed; no completion record is ever trimmed or deleted.
      tags: [Households]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90 }
      responses:
        '200':
          description: Daily completion counts over the window actually served
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyAnalytics'
  /households/{id}/year-in-review:
    get:
      summary: Year-in-review aggregation for a given calendar year
      description: >-
        On a plan with an analytics window the aggregation covers that calendar year INTERSECTED
        with the trailing window, reported as `windowStart`/`windowEnd`; a past year therefore
        comes back genuinely empty rather than silently relabelled. `historyLimitDays` is the
        plan's ceiling, or `null` for no ceiling. Completion records are never trimmed.
      tags: [Households]
      parameters:
        - { $ref: '#/components/parameters/HouseholdId' }
        - name: year
          in: query
          schema: { type: integer, minimum: 2024 }
      responses:
        '200':
          description: Completion aggregates over the year, or over the plan's window within it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YearInReview'
  /households/{householdId}/members/{userId}/role:
    put:
      summary: Promote/demote a household member (admin only)
      tags: [Households]
      parameters:
        - name: householdId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /households/{id}/climate:
    get:
      summary: Current local weather + derived climate-aware care tips
      tags: [Households]
      parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '503': { description: Weather provider or daily usage gate is temporarily unavailable }
  /households/{id}/location:
    put:
      summary: Save (or clear with `null`) the household's location for climate features
      tags: [Households]
      parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: 'null'
                - type: object
                  required: [city]
                  properties:
                    city: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { description: Geocoding provider or daily usage gate is temporarily unavailable }
  /households/{id}/move-day:
    post:
      summary: Evaluate Seasonal Move Day (idempotent per season; may create claimable move tasks)
      description: >-
        Reads the household's already-cached climate snapshot — it never calls the weather
        provider. When tonight's low crosses the frost line or today's high crosses the heat
        line, every active plant whose current space differs from its winter/summer space is
        listed, the moves are split round-robin across members who are not on vacation, and one
        claimable `custom` task per plant is created (or re-armed if last year's still exists).
        Fires at most once per season per household; later calls return the same list for 14
        days and are `quiet` after that. `unavailable` means no saved location or no live cached
        snapshot — the feature then does nothing and asserts nothing. Garden and Greenhouse
        plans only; other plans receive `locked` without evaluation.
      tags: [Households]
      parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
      responses:
        '200':
          description: Evaluation result. Every status other than `ready` renders as silence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveDayResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /households/{id}/escalation:
    put:
      summary: Set (or clear with `null`) the household's auto-handoff rule
      description: |
        Auto-handoff (ADR 0018). When `escalateAfterDays` is set, a task that many
        days overdue is put up for grabs by the hourly scan and the other members
        are told once; the previous holder is never nagged, and nobody away or
        inside their DND window is notified. The floor is 5 days and is enforced
        server-side. Admin-only; requires a plan with the household toolkit (402
        otherwise, the same upgrade signal the plant cap uses).
      tags: [Households]
      parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [escalateAfterDays]
              properties:
                escalateAfterDays:
                  type: integer
                  minimum: 5
                  maximum: 60
                  nullable: true
                  description: Days overdue before a task goes up for grabs; null turns the rule off.
      responses:
        '200':
          description: The stored rule
          content:
            application/json:
              schema:
                type: object
                properties:
                  escalateAfterDays: { type: integer, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '402': { description: The household's plan does not include the household toolkit }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /households/{householdId}/members/{userId}:
    delete:
      summary: Remove a member from a household (admin only)
      tags: [Households]
      parameters:
        - name: householdId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Member removed }
        '403': { $ref: '#/components/responses/Forbidden' }

  /households/{id}/sitter-links:
    post:
      summary: Create a no-account, time-boxed plant-sitter link (any household member). Returns the token/URL exactly once. The window and the number of live links are capped by the household's plan (402 over the cap). Every create is named in the activity feed.
      tags: [Households]
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expiresAt]
              properties:
                startsAt: { type: string, format: date-time }
                expiresAt: { type: string, format: date-time }
                label: { type: string, maxLength: 60 }
      responses:
        '201':
          description: Sitter link created (token returned once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  token: { type: string }
                  url: { type: string }
                  startsAt: { type: string, format: date-time }
                  expiresAt: { type: string, format: date-time }
                  status: { type: string, enum: [active, revoked] }
                  label: { type: string, nullable: true }
        '402':
          description: Over the plan's sitter-link cap — window longer than the plan allows, or too many live links. The message names the cap and what the next tier lifts it to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      summary: List the household's plant-sitter links (any household member). Never returns tokens.
      tags: [Households]
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /households/{id}/sitter-links/{linkId}:
    delete:
      summary: Revoke a plant-sitter link by its non-secret id. Admins may revoke any of the household's links; a member only the ones they created (403 otherwise). Idempotent.
      tags: [Households]
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - { name: linkId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Sitter link revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- Plant Tags (ADR 0016) ---
  /plants/{plantId}/tag:
    post:
      summary: Issue (or re-issue) a printable QR tag for one plant. Any member; gated on the plan (Seedling none, Garden 50, Greenhouse unlimited). An existing active tag for the plant is revoked first, so this is also the one-click rotation. Returns the token + scan URL.
      tags: [Plants]
      parameters:
        - { name: plantId, in: path, required: true, schema: { type: string } }
      responses:
        '201':
          description: Tag issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantTag'
        '402': { description: Plan does not include plant tags, or the active-tag cap is reached }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Plant is not active (died / given away / archived) }
    delete:
      summary: Revoke the plant's active tag. The printed label stops working on the next scan.
      tags: [Plants]
      parameters:
        - { name: plantId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Tag revoked }
        '404': { description: The plant has no active tag }

  /households/{id}/plant-tags:
    get:
      summary: The household's active plant tags (with tokens, for the print sheet), whether the scan PIN is on, and the plan allowance.
      tags: [Households]
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Tags + settings + allowance
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items: { $ref: '#/components/schemas/PlantTag' }
                  pinEnabled: { type: boolean }
                  allowance:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      max: { type: integer, nullable: true, description: null = unlimited }
                      used: { type: integer }
                  planId: { type: string, enum: [seedling, garden, greenhouse] }
        '403': { $ref: '#/components/responses/Forbidden' }

  /households/{id}/plant-tags/pin:
    put:
      summary: Set (four digits) or clear (null) the household PIN that scan pages must present. Admin only. Only a salted hash is stored.
      tags: [Households]
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, pattern: '^\d{4}$', nullable: true }
      responses:
        '200':
          description: Current PIN state
          content:
            application/json:
              schema:
                type: object
                properties:
                  pinEnabled: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tag/{token}:
    get:
      summary: Public plant-tag scan view. No auth; the 256-bit token is the only credential and is scoped to ONE plant. Returns the plant's name, species, photo, care notes, this plant's due tasks, and a settled-read `history` (last care / last watering by first name, or `unavailable` when the read failed — never "never watered"). When the household set a PIN it must be sent in `X-Tag-Pin`.
      tags: [Plants]
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - {
            name: X-Tag-Pin,
            in: header,
            required: false,
            schema: { type: string, pattern: '^\d{4}$' },
          }
      responses:
        '200':
          description: Scan view (one plant, no member ids / emails / location)
          content:
            application/json:
              schema:
                type: object
                properties:
                  plantName: { type: string }
                  species: { type: string, nullable: true }
                  imageUrl: { type: string, nullable: true }
                  careNotes: { type: string, nullable: true }
                  history:
                    type: object
                    properties:
                      status: { type: string, enum: [ok, unavailable] }
                      lastCare: { $ref: '#/components/schemas/PlantTagCare' }
                      lastWatered: { $ref: '#/components/schemas/PlantTagCare' }
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        taskId: { type: string }
                        taskType: { type: string }
                        dueDate: { type: string, format: date-time }
                        overdue: { type: boolean }
        '401': { description: PIN required or wrong (`details.reason` = required | wrong) }
        '404': { $ref: '#/components/responses/NotFound' }
        '423': { description: Locked after too many wrong PINs (`details.lockedUntil`) }

  /tag/{token}/tasks/{taskId}/complete:
    post:
      summary: Public "I just did this". Completes one of the TAGGED PLANT's tasks (a task on any other plant is not found), attributed to the display name the scanner typed with a `tag:{id}` actor and `viaTag` on the activity event. PIN enforced like the scan view.
      tags: [Plants]
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - { name: X-Tag-Pin, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 40 }
                expectedNextDue: { type: string, format: date-time }
      responses:
        '200':
          description: Completed (or already completed for this occurrence — `alreadyDone`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId: { type: string }
                  taskType: { type: string }
                  dueDate: { type: string, format: date-time }
                  completedByName: { type: string }
                  alreadyDone: { type: boolean }
        '401': { description: PIN required or wrong }
        '404': { $ref: '#/components/responses/NotFound' }
        '423': { description: Locked after too many wrong PINs }

  /households/{id}/caretakers:
    post:
      summary: Create a named, revocable, time-boxed caretaker seat (admin only, Greenhouse plan). Returns the token/URL exactly once, with the seat's complete permission list.
      tags: [Households]
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, expiresAt]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                startsAt: { type: string, format: date-time }
                expiresAt: { type: string, format: date-time }
      responses:
        '201':
          description: Caretaker seat created (token returned once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  token: { type: string }
                  url: { type: string }
                  name: { type: string }
                  startsAt: { type: string, format: date-time }
                  expiresAt: { type: string, format: date-time }
                  status: { type: string, enum: [active, revoked] }
                  permissions:
                    type: array
                    items: { type: string, enum: [task.complete, photo.add, note.add] }
        '402': { description: Caretaker seats require the Greenhouse plan }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      summary: List the household's caretaker seats (admin only). Never returns tokens.
      tags: [Households]
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /households/{id}/caretakers/{caretakerId}:
    delete:
      summary: Revoke a caretaker seat by its non-secret id (admin only). Idempotent. Visits already recorded are kept — they are the record of work that happened.
      tags: [Households]
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - { name: caretakerId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Caretaker revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
  /households/{id}/caretaker-report:
    get:
      summary: Proof-of-visit report for a date range — who came, when they arrived, what they did. Available to any member, not only admins. A failed read is an error, never an empty report.
      tags: [Households]
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - {
            name: from,
            in: query,
            required: false,
            schema: { type: string },
            description: 'Calendar date (YYYY-MM-DD) or ISO instant. Defaults to 30 days ago.',
          }
        - {
            name: to,
            in: query,
            required: false,
            schema: { type: string },
            description: 'Calendar date (YYYY-MM-DD) or ISO instant. Defaults to now.',
          }
      responses:
        '200':
          description: The report for the range
          content:
            application/json:
              schema:
                type: object
                properties:
                  householdId: { type: string }
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  generatedAt: { type: string, format: date-time }
                  visits: { type: array, items: { type: object } }
                  totals:
                    type: object
                    properties:
                      visits: { type: integer }
                      tasksCompleted: { type: integer }
                      photos: { type: integer }
                      notes: { type: integer }
                      caretakers: { type: integer }
                  byCaretaker: { type: array, items: { type: object } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /households/{id}/kiosk-link:
    post:
      summary: Issue (or re-issue) the household's kiosk wall-display link (admin only, Greenhouse plan). Returns the token/URL exactly once and revokes any previous link in the same call.
      tags: [Households]
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pollIntervalSeconds:
                  type: integer
                  minimum: 60
                  maximum: 3600
                  default: 300
                  description: How often the display re-reads its task list. Cost scales with wall-clock time, not usage — ~$0.01/household/month at 300s, ~$0.05 at 60s.
      responses:
        '201':
          description: Kiosk link issued (token returned once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  token: { type: string }
                  url: { type: string }
                  createdAt: { type: string, format: date-time }
                  status: { type: string, enum: [active, revoked] }
                  pollIntervalSeconds: { type: integer }
        '402': { description: The kiosk display requires the Greenhouse plan }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      summary: The household's current kiosk link, or null when it has none (admin only). Never returns the token.
      tags: [Households]
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: The live kiosk link, or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    nullable: true
                    type: object
                    properties:
                      id: { type: string }
                      householdId: { type: string }
                      createdBy: { type: string }
                      createdAt: { type: string, format: date-time }
                      status: { type: string, enum: [active, revoked] }
                      pollIntervalSeconds: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      summary: Revoke the household's kiosk link immediately (admin only). Not plan-gated — turning a wall display off must always be possible.
      tags: [Households]
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '204': { description: Kiosk link revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /households/{id}/upgrade-requests:
    post:
      summary: >-
        A member (not an admin) asks the household's admins to upgrade for a specific locked
        feature. Every admin gets an email and a browser/native push naming the feature, and the
        ask is recorded in the household activity feed. Rate-limited server-side to once per member
        per feature per 7 days. Never touches billing — admins buy through /billing/checkout.
      tags: [Households]
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feature]
              properties:
                feature:
                  type: string
                  enum:
                    [
                      chat,
                      identifications,
                      leaf_health,
                      plant_cap,
                      member_cap,
                      api_keys,
                      garden_plan,
                      greenhouse_plan,
                    ]
      responses:
        '201':
          description: Request recorded and the admins notified (delivery flags are honest — false means nothing left the building on that channel)
          content:
            application/json:
              schema:
                type: object
                properties:
                  feature: { type: string }
                  targetPlanId: { type: string, enum: [garden, greenhouse] }
                  requestedAt: { type: string, format: date-time }
                  nextAllowedAt: { type: string, format: date-time }
                  admins:
                    type: array
                    items:
                      type: object
                      properties:
                        userId: { type: string }
                        name: { type: string }
                  emailDelivered: { type: boolean }
                  pushDelivered: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Caller is an admin, the household already includes the feature, or there is no admin to ask
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: This member already asked for this feature inside the 7-day window; `details.nextAllowedAt` is set when the earlier marker could be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Payment activity is paused, so there is nothing an admin could do with the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /households/{id}/away-recap:
    get:
      summary: Away Kit return recap — replays the activity a sitter link produced inside its window (tasks checked off, photos sent back, notes). Any household member. Defaults to the most recently ended link; `linkId` selects one explicitly. 402 when the plan lacks the Away Kit; 404 when no window has ended yet; a failed read is a 5xx, never an empty recap.
      tags: [Households]
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - { name: linkId, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: The recap for one sitter window
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    type: object
                    properties:
                      id: { type: string }
                      label: { type: string, nullable: true }
                      startsAt: { type: string, format: date-time }
                      expiresAt: { type: string, format: date-time }
                      status: { type: string, enum: [active, revoked] }
                      ended: { type: boolean }
                  window:
                    type: object
                    properties:
                      from: { type: string, format: date-time }
                      to: { type: string, format: date-time }
                  tasksCompleted:
                    type: array
                    items:
                      type: object
                      properties:
                        taskId: { type: string }
                        plantId: { type: string }
                        plantName: { type: string, nullable: true }
                        taskType: { type: string }
                        occurredAt: { type: string, format: date-time }
                        actorName: { type: string }
                        notes: { type: string, nullable: true }
                  photos:
                    type: array
                    items:
                      type: object
                      properties:
                        photoId: { type: string }
                        plantId: { type: string }
                        plantName: { type: string, nullable: true }
                        imageUrl: { type: string, nullable: true }
                        caption: { type: string, nullable: true }
                        occurredAt: { type: string, format: date-time }
                  notes:
                    type: array
                    items:
                      type: object
                      properties:
                        source: { type: string, enum: [photo, task] }
                        plantId: { type: string }
                        plantName: { type: string, nullable: true }
                        text: { type: string }
                        occurredAt: { type: string, format: date-time }
                  counts:
                    type: object
                    properties:
                      tasks: { type: integer }
                      photos: { type: integer }
                      notes: { type: integer }
                  truncated:
                    {
                      type: boolean,
                      description: True when the activity scan hit its cap — the lists are a prefix,
                    }
                  generatedAt: { type: string, format: date-time }
        '402': { description: The household's plan does not include the Away Kit }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- Notifications ---
  /notifications/prefs:
    get:
      summary: Read the caller's notification preferences
      tags: [Notifications]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    put:
      summary: Update the caller's notification preferences
      tags: [Notifications]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /notifications/email-suppression:
    delete:
      summary: Resume email to the caller's own address after a bounce or complaint
      description: >-
        Removes the caller's address from the outbound suppression list. The address is taken from
        the authenticated session, never from the request, so this can only ever un-suppress the
        caller's own mailbox — including for a spam complaint, where the recipient's own action is
        the only consent that counts. Rate limited to 5/hour: an address that bounces on every send
        could otherwise be cleared and re-bounced in a loop. Returns the refreshed preferences,
        whose `emailStatus` is `ok` / `undeliverable` / `unknown` (`unknown` means the suppression
        store could not be read and is NOT a synonym for `ok`).
      tags: [Notifications]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '429': { description: Too many un-suppression requests }
  /notifications/subscribe:
    post:
      summary: Register a Web Push subscription for browser notifications
      tags: [Notifications]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /notifications/unsubscribe:
    post:
      summary: Remove a Web Push subscription
      tags: [Notifications]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /notifications/devices:
    post:
      summary:
        'Register a native (Capacitor iOS/Android) push device token (body: platform ios|android,
        token). Capture-only until the APNs/FCM sender ships — see docs/mobile.md'
      tags: [Notifications]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /notifications/devices/remove:
    post:
      summary: Remove a native push device token
      tags: [Notifications]
      responses:
        '204': { description: Device token removed }
  /notifications/email/unsubscribe:
    get:
      summary:
        RFC 8058 one-click unsubscribe landing page. Public; the capability token in `t` is the
        only credential. Renders a confirm form and changes nothing, so mail-client link scanners
        cannot unsubscribe anyone.
      tags: [Notifications]
      security: []
      parameters:
        - { name: t, in: query, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string, enum: [en, es] } }
      responses:
        '200': { description: Confirmation page (text/html) }
        '400': { description: Missing token }
        '410': { description: Token invalid or expired }
        '503': { description: Capability store unreachable; nothing was changed }
    post:
      summary:
        Turn off one email category for the token's user. Also the target of a mail provider's
        automated `List-Unsubscribe-Post`. Public and idempotent.
      tags: [Notifications]
      security: []
      parameters:
        - { name: t, in: query, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string, enum: [en, es] } }
      responses:
        '200': { description: Unsubscribed (text/html) }
        '400': { description: Missing token }
        '410': { description: Token invalid or expired }
        '503': { description: Preference write failed; nothing was changed }

  # --- Billing ---
  /billing/plans:
    get:
      summary: Public list of subscription plans
      tags: [Billing]
      security: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /billing/me:
    get:
      summary: Current household subscription state
      description: >-
        `usageDetail` reports nullable per-field counters. The legacy numeric-only `usage` object is
        included only when both counters are known, preserving rolling-deploy and cached-client safety.
      tags: [Billing]
      responses:
        '200':
          description: Subscription, plan caps, and best-known household usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSubscriptionState'
  /billing/checkout:
    post:
      summary: 'Start an idempotent Stripe checkout session (body: planId, optional interval month|year|lifetime, optional checkoutAttemptId UUID)'
      tags: [Billing]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /billing/top-up/checkout:
    post:
      summary: Start a one-time Stripe checkout for an identification top-up pack (admin only)
      description: >-
        Sells the pack described by `identifyTopUp` on GET /billing/plans (20 identifications, valid 12
        months, never auto-renewed; ADR 0019). Credits are granted by the Stripe webhook, idempotently on
        the Checkout Session id, and drawn on only after the plan's monthly allowance is spent. Fails
        CLOSED: when no Stripe price is configured for this environment the answer is a 400 whose
        `details.code` is `TOP_UP_NOT_CONFIGURED` — never a fallback price, never a free credit.
      tags: [Billing]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                checkoutAttemptId:
                  type: string
                  format: uuid
                  description: Generated once per click; forwarded as Stripe's idempotency key.
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400':
          {
            description: Top-up pack not for sale in this environment (`details.code` = TOP_UP_NOT_CONFIGURED),
          }
        '403': { description: Admin-only }
        '503': { description: Payments paused }
  /billing/portal:
    post:
      summary: Open the Stripe customer portal for plan management
      tags: [Billing]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /billing/webhook:
    post:
      summary: Stripe webhook receiver (signature-verified; raw body)
      tags: [Billing]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # --- API Keys (Greenhouse plan only) ---
  /api-keys:
    get:
      summary: List API keys for the active household
      tags: [API Keys]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      summary: Mint a new API key (returned once, plaintext)
      tags: [API Keys]
      responses:
        '201': { $ref: '#/components/responses/Ok' }
  /api-keys/{id}:
    delete:
      summary: Revoke an API key
      tags: [API Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Revoked }

  # --- Public API (api-key auth) ---
  /api/v1/me:
    get:
      summary: Public-API caller identity
      tags: [Public API]
      security:
        - apiKeyAuth: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /api/v1/plants:
    get:
      summary: Public-API plant list
      tags: [Public API]
      security:
        - apiKeyAuth: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /api/v1/plants/{id}:
    get:
      summary: Public-API plant detail
      tags: [Public API]
      security:
        - apiKeyAuth: []
      parameters: [{ $ref: '#/components/parameters/PlantId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /api/v1/tasks:
    get:
      summary: Public-API task list
      tags: [Public API]
      security:
        - apiKeyAuth: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /api/v1/activity:
    get:
      summary: Public-API household activity feed
      tags: [Public API]
      security:
        - apiKeyAuth: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # --- Species (Perenual-backed) ---
  /species/search:
    get:
      summary: Species autocomplete (Perenual-backed; falls back to disabled when unconfigured)
      tags: [Species]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /species/toxicity:
    get:
      summary: Public pet-toxicity lookup (cat/dog safety) for a plant name. No auth; curated static data, cached publicly.
      tags: [Species]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /species/{id}:
    get:
      summary: Species detail with distinct found, not-found, and retryable-unavailable states
      tags: [Species]
      parameters: [{ $ref: '#/components/parameters/SpeciesId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /species/{id}/care-suggestions:
    get:
      summary: Derived care suggestion (watering cadence + sunlight summary)
      tags: [Species]
      parameters: [{ $ref: '#/components/parameters/SpeciesId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /species/{id}/thumbnail:
    get:
      summary: 302 redirect to the cached species thumbnail URL
      tags: [Species]
      parameters: [{ $ref: '#/components/parameters/SpeciesId' }]
      responses:
        '302': { description: Redirect to thumbnail }
        '404': { $ref: '#/components/responses/NotFound' }
  /species/{id}/guide:
    get:
      summary: Long-form species care guide
      tags: [Species]
      parameters:
        - { $ref: '#/components/parameters/SpeciesId' }
        - name: locale
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # --- Plants ID (Plant.id integration) ---
  /plants/identify:
    post:
      summary: Identify a plant from a base64-encoded image
      tags: [Plants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  description: Base64-encoded JPEG/PNG or a data URL. Cap at 256 KB after encoding.
      responses:
        '200':
          description: >-
            Suggestions plus `usage` ({ used, allowance, meteringEnabled }). On the enforced path the
            object also carries `source` (`allowance` | `credit`) and, after a credit spend, `credits`
            (IdentifyCreditBalance). Both are omitted when credits were not consulted.
        '402':
          description: >-
            Monthly allowance exhausted and no top-up credit left. `details` carries
            `code: IDENTIFY_BUDGET_EXHAUSTED`, `topUpAvailable` (true only when the caller has a household,
            payments are on, and a top-up price is configured), `credits` (IdentifyCreditBalance with a
            real 0, or null when credits were not consulted), and `topUp` ({ credits, priceUsd } or null).
        '502': { description: Plant.id upstream failed }
        '503': { description: Metering unavailable; nothing was charged and nothing was reserved }

  # --- Notifications: manual reminder kick (also runs hourly via EventBridge) ---
  /notifications/run-reminders:
    post:
      summary: Manually trigger reminder delivery for the caller's household
      tags: [Notifications]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { description: Admin-only }

  # --- Chat (Bedrock Claude + tool use + RAG; internal-only, surface unstable) ---
  /chat/messages:
    post:
      summary: Send a chat turn (text in, text + proposals out)
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 4000 }
                conversationId: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '429': { description: Monthly token budget exhausted }
  /chat/conversations/{id}/messages:
    get:
      summary: Replay a conversation's persisted message history
      tags: [Chat]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /chat/budget:
    get:
      summary: Current month's chat budget usage for the active household
      tags: [Chat]
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # --- 2026-06 roadmap wave: claiming, vacation, import, share, health,
  # --- digests, phone verification, public-API writes ---
  /tasks/{id}/claim:
    post:
      summary: Claim an unassigned task or take over a space-inherited assignment (409 for an explicit/already-claimed task)
      tags: [Tasks]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /tasks/{id}/unclaim:
    post:
      summary: Release a task you claimed (assignee only)
      tags: [Tasks]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /tasks/{id}/ask:
    post:
      summary: Ask the household to pick up this task occurrence, with an optional note (free on every tier)
      description: >
        Puts THIS occurrence up for grabs — the same state auto-handoff
        escalation reaches (ADR 0018), through a human door (ADR 0024) — and
        notifies every household member except the asker, anyone away, and
        anyone inside their Do-Not-Disturb window. The response reports who
        was reached and who was deliberately skipped: an empty `recipients`
        means nobody could be reached right now, which is a real outcome and
        not a failure. One ask per task per member per 24 hours.
      tags: [Tasks]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403':
          description: Another member explicitly holds this task; only they can release it
        '409':
          description: This occurrence has already been asked about, or it changed under you
        '429':
          description: Already asked about this task inside the 24-hour window (`nextAllowedAt` when known)
  /tasks/vacation:
    get:
      summary: List active and upcoming vacation coverage windows
      tags: [Tasks]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    put:
      summary: Set a vacation coverage window (admin required to set for others)
      tags: [Tasks]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /tasks/vacation/{userId}:
    delete:
      summary: Clear a member's vacation window (self or admin)
      tags: [Tasks]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /plants/import:
    post:
      summary: Bulk import up to 100 plants (+tasks); partial success at plan cap
      tags: [Plants]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /plants/{id}/share:
    post:
      summary: Mint a 14-day cutting-share link for a plant snapshot
      tags: [Plants]
      parameters: [{ $ref: '#/components/parameters/PlantId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /plants/shared/{code}:
    get:
      summary: Public preview of a shared cutting card (snapshot + household name)
      tags: [Plants]
      security: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /plants/shared/{code}/accept:
    post:
      summary: Copy a shared cutting into the caller's household (plan-capped)
      tags: [Plants]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '201': { $ref: '#/components/responses/Ok' }
  /plants/{id}/health-check:
    post:
      summary: Leaf-health assessment of an uploaded photo (Bedrock vision)
      tags: [Plants]
      parameters: [{ $ref: '#/components/parameters/PlantId' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '429':
          description: Monthly leaf-health allowance exhausted
        '502':
          description: Bedrock could not analyze the image
        '503':
          description: The atomic usage gate is temporarily unavailable
  /notifications/run-digests:
    post:
      summary: Manually trigger the weekly plants-at-risk digest (admin, rate-limited)
      tags: [Notifications]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /notifications/run-year-recap:
    post:
      summary: Manually trigger the year-in-review recap email (admin, rate-limited)
      tags: [Notifications]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /notifications/phone/start-verification:
    post:
      summary: Send an SMS verification code to a phone number (3/hour)
      tags: [Notifications]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /notifications/phone/confirm-verification:
    post:
      summary: Confirm the SMS code and mark the phone verified
      tags: [Notifications]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /api/v1/tasks/{id}/complete:
    post:
      summary: Complete a task via API key (requires write:tasks scope)
      tags: [Public API]
      security: [{ apiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                notes: { type: string, maxLength: 500 }
                expectedNextDue:
                  type: string
                  format: date-time
                  description: Echo the task's current nextDue value to make retries idempotent.
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /api/v1/tasks/{id}/snooze:
    post:
      summary: Snooze a task via API key (requires write:tasks scope)
      tags: [Public API]
      security: [{ apiKeyAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                days: { type: integer, minimum: 1, maximum: 365 }
                expectedNextDue:
                  type: string
                  format: date-time
                  description: Echo the task's current nextDue value to make retries idempotent.
      responses:
        '200': { $ref: '#/components/responses/Ok' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    PlantId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlantIdAlt:
      name: plantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HouseholdId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteCode:
      name: inviteCode
      in: path
      required: true
      schema:
        type: string
    SpeciesId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    Ok:
      description: OK
      content:
        application/json:
          schema:
            type: object
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    CalendarTokenStatus:
      type: object
      properties:
        active: { type: boolean }
        createdAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
    BillingUsage:
      type: object
      additionalProperties: false
      description: >-
        Legacy numeric-only usage. This object is omitted from /billing/me unless both counters are
        known.
      required: [plantCount, maxPlants, memberCount, maxMembers]
      properties:
        plantCount: { type: integer, minimum: 0 }
        maxPlants: { type: integer, minimum: 0, nullable: true }
        memberCount: { type: integer, minimum: 0 }
        maxMembers: { type: integer, minimum: 0, nullable: true }

    BillingUsageDetail:
      type: object
      additionalProperties: false
      description: >-
        Best-known usage. A null COUNTER means its value is unavailable; it never means zero. A
        null CAP means the plan has no ceiling on that dimension (unlimited members on Garden and
        Greenhouse). The two nulls are different answers and must not be conflated.
      required: [plantCount, maxPlants, memberCount, maxMembers]
      properties:
        plantCount: { type: integer, minimum: 0, nullable: true }
        maxPlants: { type: integer, minimum: 0, nullable: true }
        memberCount: { type: integer, minimum: 0, nullable: true }
        maxMembers: { type: integer, minimum: 0, nullable: true }

    BillingSubscriptionState:
      type: object
      additionalProperties: false
      required: [planId, usageDetail]
      properties:
        planId: { type: string, enum: [seedling, garden, greenhouse] }
        stripeCustomerId: { type: string }
        stripeSubscriptionId: { type: string }
        status:
          type: string
          description: Current Stripe subscription or retained entitlement status, when present.
        currentPeriodEnd: { type: string, format: date-time }
        usage:
          allOf:
            - $ref: '#/components/schemas/BillingUsage'
          description: >-
            Compatibility field for numeric-only clients; omitted whenever either counter is unknown.
        usageDetail:
          $ref: '#/components/schemas/BillingUsageDetail'
        lifetimePlanId: { type: string, enum: [garden, greenhouse] }
        cancelAtPeriodEnd: { type: boolean }
        identifyCredits:
          description: >-
            Identification top-up credits (ADR 0019). `null` means the balance could not be read and is
            unknown — never zero. A genuine zero is `{ remaining: 0, expiresAt: null }`.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/IdentifyCreditBalance'

    IdentifyCreditBalance:
      type: object
      additionalProperties: false
      required: [remaining, expiresAt]
      properties:
        remaining:
          type: integer
          minimum: 0
          description: Credits left across every unexpired pack.
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: When the soonest-expiring pack with credits runs out; null when none remain.

    PlanLimits:
      type: object
      additionalProperties: false
      description: >-
        Per-tier structural caps. A number is the ceiling; `null` is UNLIMITED — a deliberate,
        typed value, never a missing one, and never `Infinity` (which JSON cannot carry). Caps
        limit new growth only: a household already above one keeps everything it has and is
        refused only the next add.
      required:
        [homes, members, plants, tags, analyticsHistoryDays, sitterLinkMaxDays, sitterLinksActive]
      properties:
        homes: { type: integer, minimum: 0, nullable: true }
        members: { type: integer, minimum: 0, nullable: true }
        plants: { type: integer, minimum: 0, nullable: true }
        tags: { type: integer, minimum: 0, nullable: true }
        analyticsHistoryDays: { type: integer, minimum: 1, nullable: true }
        sitterLinkMaxDays: { type: integer, minimum: 1, nullable: true }
        sitterLinksActive: { type: integer, minimum: 0, nullable: true }

    PlanFeatures:
      type: object
      additionalProperties: false
      description: Per-tier capability flags. True means the tier includes the capability.
      required:
        [
          awayKit,
          householdToolkit,
          plantTags,
          crossHomeToday,
          kiosk,
          caretakerSeats,
          moveDay,
          chat,
          apiKeys,
        ]
      properties:
        awayKit: { type: boolean }
        householdToolkit: { type: boolean }
        plantTags: { type: boolean }
        crossHomeToday: { type: boolean }
        kiosk: { type: boolean }
        caretakerSeats: { type: boolean }
        moveDay: { type: boolean }
        chat: { type: boolean }
        apiKeys: { type: boolean }

    DailyAnalytics:
      type: object
      additionalProperties: false
      required: [days, series, doubleCare]
      properties:
        days:
          type: integer
          minimum: 1
          description: The window actually served, after clamping to the plan's ceiling.
        series:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [date, count]
            properties:
              date: { type: string, format: date }
              count: { type: integer, minimum: 0 }
        historyLimitDays:
          type: integer
          minimum: 1
          nullable: true
          description: >-
            The plan's analytics window; `null` means no ceiling, never "unknown". ABSENT when the
            plan itself could not be read — the one genuinely unknown state, and the reason this
            field is not required.
        doubleCare:
          type: object
          description: >-
            Confirmed double-care completions this UTC calendar month. Three explicit states, so a
            failed read is never rendered as "0 duplicates".
          required: [status]
          properties:
            status: { type: string, enum: [ok, unavailable, not_in_plan] }
            month: { type: string }
            confirmedDuplicates: { type: integer, minimum: 0 }

    YearInReview:
      type: object
      additionalProperties: false
      required: [year, totalCompletions, byMember, byTaskType, topPlants, historyLimitDays]
      properties:
        year: { type: integer }
        totalCompletions: { type: integer, minimum: 0 }
        byMember:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [userId, name, count]
            properties:
              userId: { type: string }
              name: { type: string }
              count: { type: integer, minimum: 0 }
        byTaskType:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [type, count]
            properties:
              type: { type: string }
              count: { type: integer, minimum: 0 }
        topPlants:
          type: array
          description: Every plant with at least one completion in the window — not a capped top-N.
          items:
            type: object
            additionalProperties: false
            required: [plantId, count]
            properties:
              plantId: { type: string, format: uuid }
              count: { type: integer, minimum: 0 }
        historyLimitDays:
          type: integer
          minimum: 1
          nullable: true
          description: The plan's analytics window; `null` means the whole year was aggregated.
        windowStart:
          type: string
          format: date-time
          description: Present only when a window applied — the start of the range aggregated.
        windowEnd:
          type: string
          format: date-time
          description: Present only when a window applied — the end of the range aggregated.

    FrontendTelemetryEvent:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, sessionId, route, name, message, fingerprint]
          properties:
            kind: { type: string, enum: [error] }
            sessionId: { type: string, format: uuid }
            route:
              type: string
              maxLength: 180
              pattern: '^/(?:[A-Za-z0-9_.:-]+/?)*$'
            name:
              type: string
              enum:
                [
                  ChunkLoadError,
                  Error,
                  EvalError,
                  NetworkError,
                  RangeError,
                  ReferenceError,
                  SyntaxError,
                  TypeError,
                  URIError,
                ]
            message:
              type: string
              enum:
                - Application update or chunk load failed
                - Network request failed
                - ChunkLoadError in browser
                - Error in browser
                - EvalError in browser
                - NetworkError in browser
                - RangeError in browser
                - ReferenceError in browser
                - SyntaxError in browser
                - TypeError in browser
                - URIError in browser
            fingerprint: { type: string, pattern: '^[a-f0-9]{8,64}$' }
            release: { type: string, pattern: '^[A-Za-z0-9._-]{1,80}$' }
        - type: object
          additionalProperties: false
          required: [kind, sessionId, route, metric, value, rating]
          properties:
            kind: { type: string, enum: [vital] }
            sessionId: { type: string, format: uuid }
            route:
              type: string
              maxLength: 180
              pattern: '^/(?:[A-Za-z0-9_.:-]+/?)*$'
            metric: { type: string, enum: [LCP, CLS, INP] }
            value: { type: number, minimum: 0, maximum: 100000 }
            rating: { type: string, enum: [good, needs-improvement, poor] }
            release: { type: string, pattern: '^[A-Za-z0-9._-]{1,80}$' }

    ProductTelemetryEvent:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event:
          type: string
          enum:
            - signup_completed
            - household_created
            - household_joined
            - invite_sent
            - invite_accepted
            - plant_added
            - plant_lifecycle_changed
            - plants_imported
            - plants_moved
            - task_created
            - task_completed
            - task_snoozed
            - photo_uploaded
            - subscription_upgraded
            - subscription_canceled
            - data_exported
            - plant_identified
            - leaf_health_checked
            - plant_shared
            - plant_share_accepted
            - cutting_graft_started
            - household_switched
            - shared_care_pulse_action
            - climate_location_set
            - experiment_viewed
        properties:
          type: object
          description: Enum-like event discriminators only; never user-entered text.
          additionalProperties: false
          properties:
            plan: { type: string, enum: [seedling, garden, greenhouse] }
            ordinal: { type: string, enum: [first, subsequent] }
            taskType: { type: string, enum: [water, fertilize, prune, repot, custom] }
            memberCount: { type: string, enum: ['1', '2-5', '6+'] }
            upgradeTo: { type: string, enum: [garden, greenhouse] }
            interval: { type: string, enum: [month, year, lifetime] }
            context:
              type: string
              pattern: '^(?:[a-z][a-z0-9_-]{0,31}|\d{1,6})$'
            experiment:
              type: string
              pattern: '^[a-z][a-z0-9_-]{0,47}$'
            variant: { type: string, enum: [A, B] }
        superProperties:
          type: object
          maxProperties: 10
          propertyNames:
            pattern: '^[a-z][a-z0-9_-]{0,47}$'
          additionalProperties:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,48}$'

    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).+$'
        name:
          type: string
          minLength: 2
          maxLength: 100

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    ResetPasswordRequest:
      type: object
      required: [email, code, newPassword]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
        newPassword:
          type: string
          minLength: 12
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).+$'

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 12
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).+$'

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        refreshToken:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        householdId:
          type: string
          format: uuid
          nullable: true
        householdRole:
          type: string
          enum: [admin, member]
          nullable: true

    Plant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        name:
          type: string
        species:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        spaceId:
          type: string
          format: uuid
          nullable: true
        placementNote:
          type: string
          nullable: true
        summerSpaceId:
          type: string
          format: uuid
          nullable: true
        winterSpaceId:
          type: string
          format: uuid
          nullable: true
        imageUrl:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        careRule:
          type: string
          nullable: true
          maxLength: 140
          description: House rule — one short care convention shown at completion time; null when none is set.
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        updatedAt:
          type: string
          format: date-time

    PlantWithTasks:
      allOf:
        - $ref: '#/components/schemas/Plant'
        - type: object
          properties:
            upcomingTasks:
              type: array
              items:
                $ref: '#/components/schemas/Task'
            recentCompletions:
              type: array
              items:
                $ref: '#/components/schemas/TaskCompletion'

    CreatePlantRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        species:
          type: string
          maxLength: 100
        location:
          type: string
          maxLength: 100
        spaceId:
          type: string
          format: uuid
        placementNote:
          type: string
          maxLength: 120
        summerSpaceId:
          type: string
          format: uuid
        winterSpaceId:
          type: string
          format: uuid
        notes:
          type: string
          maxLength: 1000
        careRule:
          type: string
          maxLength: 140
          description: Trimmed server-side; whitespace-only is stored as null.

    UpdatePlantRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        species:
          type: string
          maxLength: 100
          nullable: true
        location:
          type: string
          maxLength: 100
          nullable: true
        spaceId:
          type: string
          format: uuid
          nullable: true
        placementNote:
          type: string
          maxLength: 120
          nullable: true
        summerSpaceId:
          type: string
          format: uuid
          nullable: true
        winterSpaceId:
          type: string
          format: uuid
          nullable: true
        notes:
          type: string
          maxLength: 1000
          nullable: true
        careRule:
          type: string
          maxLength: 140
          nullable: true
          description: Trimmed server-side; null or whitespace-only clears the rule.

    MovePlantsRequest:
      type: object
      required: [plantIds, spaceId]
      properties:
        plantIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
        spaceId:
          type: string
          format: uuid
          nullable: true
        placementNote:
          type: string
          maxLength: 120
          nullable: true

    SpaceRotation:
      type: object
      required: [memberIds, cadence]
      description: |
        Care rotation for a space (ADR 0018). Time-indexed from `anchor`, so
        "whose turn" is derived from the clock rather than a stored counter and
        a skipped cycle cannot desynchronise it. At least two members.
      properties:
        memberIds:
          type: array
          minItems: 2
          maxItems: 20
          items: { type: string, format: uuid }
          description: Members in turn order; must all be current household members.
        cadence:
          type: string
          enum: [weekly, monthly]
        anchor:
          type: string
          format: date-time
          description: Instant period 0 starts at. Server-stamped when omitted; preserved when only the member list changes.

    PlantSpace:
      type: object
      required: [id, householdId, name, environment, rainExposure, createdAt, createdBy, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        name:
          type: string
        environment:
          type: string
          enum: [inside, outside]
        rainExposure:
          type: string
          enum: [exposed, sheltered]
          description: Whether rainfall reaches plants; legacy outdoor spaces default to exposed.
        lightLevel:
          type: string
          enum: [low, medium, bright]
          nullable: true
          description: Approximate ambient light; null means the household has not assessed it.
        petAccess:
          type: boolean
          nullable: true
          description: Whether cats or dogs can reach plants; null means unknown.
        defaultCaregiverId:
          type: string
          format: uuid
          nullable: true
          description: Current household member inherited by new tasks for plants in this space.
        rotation:
          allOf: [{ $ref: '#/components/schemas/SpaceRotation' }]
          nullable: true
          description: Care rotation; takes precedence over defaultCaregiverId. Null means none.
        rotationTurn:
          type: object
          description: |
            Derived, read-only. Present only on spaces that HAVE a rotation.
            `turnUserId: null` means every member of the rotation is currently
            away — a real answer, not a missing one.
          properties:
            turnUserId: { type: string, format: uuid, nullable: true }
            turnName: { type: string, nullable: true }
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        updatedAt:
          type: string
          format: date-time

    CreateSpaceRequest:
      type: object
      required: [name, environment]
      properties:
        name:
          type: string
          maxLength: 80
        environment:
          type: string
          enum: [inside, outside]
        rainExposure:
          type: string
          enum: [exposed, sheltered]
        lightLevel:
          type: string
          enum: [low, medium, bright]
        petAccess:
          type: boolean
        defaultCaregiverId:
          type: string
          format: uuid
        rotation:
          $ref: '#/components/schemas/SpaceRotation'

    UpdateSpaceRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        environment:
          type: string
          enum: [inside, outside]
        rainExposure:
          type: string
          enum: [exposed, sheltered]
        lightLevel:
          type: string
          enum: [low, medium, bright]
          nullable: true
        petAccess:
          type: boolean
          nullable: true
        defaultCaregiverId:
          type: string
          format: uuid
          nullable: true
        rotation:
          allOf: [{ $ref: '#/components/schemas/SpaceRotation' }]
          nullable: true
          description: Null clears the rotation.

    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        plantId:
          type: string
          format: uuid
        plantName:
          type: string
        type:
          type: string
          enum: [water, fertilize, prune, repot, custom]
        customType:
          type: string
          nullable: true
        frequency:
          type: integer
        lastCompleted:
          type: string
          format: date-time
          nullable: true
        nextDue:
          type: string
          format: date-time
        assignedTo:
          type: string
          format: uuid
          description: Current assignee; assignmentSource identifies a space-inherited assignment.
          nullable: true
        assignedToName:
          type: string
          nullable: true
        assignmentSource:
          type: string
          enum: [space_default, rotation]
          nullable: true
          description: Inherited assignments — a space default or a care-rotation turn — remain claimable by another household member and are re-resolved each occurrence; null means explicit (chosen or claimed) or unassigned.
        notes:
          type: string
          nullable: true
        escalatedAt:
          type: string
          format: date-time
          nullable: true
          description: When auto-handoff last put this task up for grabs (ADR 0018); absent on never-escalated tasks.
        escalatedForDue:
          type: string
          format: date-time
          nullable: true
          description: The `nextDue` the escalation fired for. Equal to `nextDue` while the escalated occurrence is still open; a completion advances `nextDue` and re-arms the rule.
        escalatedFrom:
          type: string
          format: uuid
          nullable: true
          description: The member the task was taken from, or null if it was unassigned.

    TaskCompletion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        taskType:
          type: string
        completedBy:
          type: string
          format: uuid
        completedByName:
          type: string
        completedAt:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true

    CreateTaskRequest:
      type: object
      required: [plantId, type, frequency]
      properties:
        plantId:
          type: string
          format: uuid
        type:
          type: string
          enum: [water, fertilize, prune, repot, custom]
        customType:
          type: string
          maxLength: 50
        frequency:
          type: integer
          minimum: 1
          maximum: 365
        assignedTo:
          type: string
          format: uuid
          description: Explicit assignee. When omitted, the plant's current space caregiver is inherited if configured.
        notes:
          type: string
          maxLength: 500

    Household:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        escalateAfterDays:
          type: integer
          nullable: true
          description: Auto-handoff rule (days overdue before a task goes up for grabs); null or absent means off.
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid

    HouseholdWithMembers:
      allOf:
        - $ref: '#/components/schemas/Household'
        - type: object
          properties:
            members:
              type: array
              items:
                $ref: '#/components/schemas/HouseholdMember'

    HouseholdMember:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member]
        joinedAt:
          type: string
          format: date-time

    CreateHouseholdRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
        details:
          type: object

    # Plant Tags (ADR 0016)
    PlantTagCare:
      type: object
      nullable: true
      description: One completion as the scan page shows it — first name only for members; the typed display name for tag completions.
      properties:
        taskType: { type: string }
        completedAt: { type: string, format: date-time }
        completedByName: { type: string }
        viaTag: { type: boolean }
    PlantTag:
      type: object
      description: A household-side view of one active tag. Includes the token because the household needs it to print the QR label (see ADR 0016).
      properties:
        id: { type: string }
        householdId: { type: string }
        plantId: { type: string }
        plantName: { type: string }
        plantSpecies: { type: string, nullable: true }
        plantStatus: { type: string, enum: [active, died, gave_away, archived] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [active, revoked] }
        revokedAt: { type: string, format: date-time, nullable: true }
        token: { type: string, description: 64 lowercase hex chars (256 bits) }
        url: { type: string, description: The scan URL the QR code encodes }
    MoveDayResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [locked, not_applicable, unavailable, quiet, ready]
          description: >-
            `locked` — plan does not include Move Day. `not_applicable` — no outdoor space or
            no plant with a seasonal home. `unavailable` — no saved location or no live cached
            snapshot (nothing is inferred). `quiet` — snapshot read, no line crossed / season
            already handled / nothing out of place. `ready` — a list exists (see `list`).
        list:
          type: object
          description: Present only when `status` is `ready`.
          required: [season, firedAt, signal, items, tenderWithoutWinterHome]
          properties:
            season: { type: string, enum: [winter, summer] }
            firedAt: { type: string, format: date-time }
            signal:
              type: object
              description: The measured numbers that fired the list and the lines they crossed.
              properties:
                tempC: { type: number }
                lowC: { type: number }
                frostLineC: { type: number }
                heatLineC: { type: number }
            items:
              type: array
              items:
                type: object
                properties:
                  plantId: { type: string, format: uuid }
                  plantName: { type: string }
                  fromSpaceId: { type: string, format: uuid, nullable: true }
                  fromSpaceName: { type: string, nullable: true }
                  toSpaceId: { type: string, format: uuid }
                  toSpaceName: { type: string }
                  assigneeId: { type: string, format: uuid, nullable: true }
                  assigneeName: { type: string, nullable: true }
                  taskId: { type: string, format: uuid, nullable: true }
            tenderWithoutWinterHome:
              type: array
              description: >-
                Winter only. Outdoor plants with no winter space whose already-cached species
                record is frost-tender (USDA zone 10+). Presence-only — plants without a cached
                species record are absent, not cleared.
              items:
                type: object
                properties:
                  plantId: { type: string, format: uuid }
                  plantName: { type: string }
                  hardinessZone: { type: string }
