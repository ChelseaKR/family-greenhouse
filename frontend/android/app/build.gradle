apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def uploadKeystore = System.getenv('ANDROID_UPLOAD_KEYSTORE')
def uploadKeystorePassword = System.getenv('ANDROID_UPLOAD_KEYSTORE_PASSWORD')
def uploadKeyAlias = System.getenv('ANDROID_UPLOAD_KEY_ALIAS')
def uploadKeyPassword = System.getenv('ANDROID_UPLOAD_KEY_PASSWORD')

android {
    namespace = "net.familygreenhouse.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "net.familygreenhouse.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Deterministic SemVer mapping: 0.23.0 -> 2300. Increment this for
        // every store upload; Play never accepts a reused versionCode.
        versionCode 4400
        versionName "0.44.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (uploadKeystore && uploadKeystorePassword && uploadKeyAlias && uploadKeyPassword) {
                storeFile file(uploadKeystore)
                storePassword uploadKeystorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildFeatures {
        compose true
    }
    testOptions {
        // The frame's routing, alert, form-sheet and review rules are plain
        // Kotlin (no Android types), so they run as local JVM tests.
        unitTests.returnDefaultValues = true
    }
    buildTypes {
        release {
            if (uploadKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        // Matches capacitor.build.gradle's Java 21.
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // The native frame, Settings list and sheets (Material 3 in
    // Jetpack Compose), drawn around and over the one WebView.
    implementation platform("androidx.compose:compose-bom:$composeBomVersion")
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    // Google Play's in-app review card (review/NativeReviewPlugin.kt, ADR 0036).
    implementation "com.google.android.play:review:$playReviewVersion"
    // The reminder notifications the app draws itself (push/): the Firebase
    // messaging classes FgMessagingService extends. The same version the
    // Capacitor push plugin compiles against (firebaseMessagingVersion).
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
