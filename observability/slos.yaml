version: 1
service: family-greenhouse
owner: support@familygreenhouse.net
window_days: 28

slos:
  availability:
    target_percent: 99.5
    indicator:
      source: cloudwatch_metric_filters
      namespace: FamilyGreenhouse/API/{environment}
      good_events: ApplicationRequests - Application5xx
      total_events: ApplicationRequests
      exclude_routes:
        - GET /health
    burn_rate_alerts:
      - name: fast
        multiplier: 14.4
        error_rate_percent: 7.2
        window_minutes: 60
      - name: slow
        multiplier: 6
        error_rate_percent: 3
        window_minutes: 360

  latency:
    objective: p95 <= 500ms
    indicator:
      source: api_gateway_access_logs
      field: responseLatency
      exclude_routes:
        - GET /health
    # The objective is a percentile over the 28-day window above, so the alert
    # on it is a burn rate against its 5% error budget. It is deliberately not
    # a percentile over a five-minute period: at this traffic volume the
    # median five-minute period holds two requests, and a p95 over two samples
    # is the slower of the two. See the comment on
    # aws_cloudwatch_metric_alarm.latency_fast_burn for the measurements.
    # Multipliers and windows match the availability burn alerts above.
    burn_rate_alerts:
      - name: fast
        multiplier: 14.4
        slow_rate_percent: 72
        window_minutes: 60
      - name: slow
        multiplier: 6
        slow_rate_percent: 30
        window_minutes: 360

  saturation:
    objective: zero throttled requests
    indicators:
      - AWS/Lambda Throttles
      - AWS/DynamoDB ReadThrottleEvents
      - AWS/DynamoDB WriteThrottleEvents

  frontend_experience:
    aggregation: p75
    indicators:
      LCP_ms: 2500
      CLS: 0.1
      INP_ms: 200
    privacy: sanitized first-party telemetry; no stacks, user ids, query strings, or free text

response:
  alert_topic: family-greenhouse-alerts-production
  runbook: docs/observability.md
  rollback: docs/deployment.md
